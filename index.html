<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>当五郎 - 競艇全場予想</title>
    <style>
        body { font-family: sans-serif; background: #eceff1; margin: 0; padding: 0; }
        .header { background: #01579b; color: white; padding: 20px; text-align: center; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .controls { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input[type="date"] { padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 1rem; margin-bottom: 10px; width: 80%; }
        button { padding: 12px 25px; background: #ffc107; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 80%; }
        .stadium-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 20px; border-left: 8px solid #e60000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .stadium-name { font-size: 1.3rem; font-weight: bold; color: #333; border-bottom: 2px solid #eee; padding-bottom: 5px; margin-bottom: 10px; }
        .race-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
        .race-item { background: #f9f9f9; border: 1px solid #ddd; padding: 8px; border-radius: 5px; text-align: center; }
        .race-no { font-size: 0.8rem; color: #666; font-weight: bold; }
        .prediction { font-size: 1rem; color: #007bff; font-weight: bold; display: block; margin-top: 3px; }
        #status { text-align: center; font-weight: bold; color: #d32f2f; margin: 10px; }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0;">当五郎</h1>
    <p style="margin:5px 0 0; opacity:0.8;">開催場限定・全レース三連単予想</p>
</div>

<div class="container">
    <div class="controls">
        <input type="date" id="targetDate">
        <button onclick="startPrediction()">予想を開始する</button>
    </div>
    <div id="status"></div>
    <div id="output"></div>
</div>

<script>
    window.onload = () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('targetDate').value = today;
    };

    async function startPrediction() {
        const dateInput = document.getElementById('targetDate').value;
        const output = document.getElementById('output');
        const status = document.getElementById('status');
        
        if(!dateInput) return;
        const ymd = dateInput.replace(/-/g, '');
        
        output.innerHTML = '';
        status.innerText = '開催会場を読み込み中...';

        try {
            const response = await fetch(`https://boatraceopenapi.github.io/programs/${ymd}/all.json`);
            if(!response.ok) throw new Error('データが見つかりませんでした');
            const data = await response.json();
            
            status.innerText = '';
            
            data.forEach(stadium => {
                const card = document.createElement('div');
                card.className = 'stadium-card';
                
                let raceHtml = '';
                stadium.races.forEach(race => {
                    const pred = generateLogic(race.players);
                    raceHtml += `
                        <div class="race-item">
                            <span class="race-no">${race.raceNo}R</span>
                            <span class="prediction">${pred}</span>
                        </div>`;
                });

                card.innerHTML = `
                    <div class="stadium-name">${stadium.stadiumName}</div>
                    <div class="race-list">${raceHtml}</div>
                `;
                output.appendChild(card);
            });

        } catch (e) {
            status.innerText = 'エラー: 本日のデータがまだ準備されていないか、開催がありません。';
        }
    }

    function generateLogic(players) {
        if(!players) return "---";
        // 勝率スコア計算
        let list = players.map(p => ({
            no: p.bracketNo,
            score: (parseFloat(p.nationalWinRate) || 0) * 0.7 + (parseFloat(p.localWinRate) || 0) * 0.3
        }));
        
        list.sort((a, b) => b.score - a.score);
        const top = list.map(l => l.no);

        // 三連単ロジック：1号艇が強ければ1頭、そうでなければ上位ボックス
        if (top[0] === 1) {
            return `1-${top[1]}${top[2]}-${top[1]}${top[2]}${top[3]}`;
        } else {
            return `${top[0]}-${top[1]}-${top[2]}`;
        }
    }
</script>

</body>
</html>
