<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>当五郎 - 競艇全場予想</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; color: #333; }
        .header-container { background: #004d99; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .controls { margin-top: 15px; display: flex; gap: 10px; align-items: center; }
        input[type="date"] { padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 1rem; }
        button { padding: 10px 20px; background: #ffcc00; color: #333; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #e6b800; }
        .card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .stadium-name { font-weight: bold; color: #e60000; border-bottom: 2px solid #e60000; margin-bottom: 10px; font-size: 1.2rem; }
        .race-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .race-item { border: 1px solid #ddd; padding: 10px; border-radius: 5px; background: #fff; }
        .prediction { font-weight: bold; color: #007bff; font-size: 1.1rem; margin-top: 5px; }
        #status { font-weight: bold; color: #e60000; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>当五郎</h1>
        <p>全国24会場の全レースを三連単で自動予想します。</p>
        <div class="controls">
            <input type="date" id="targetDate">
            <button onclick="fetchRaces()">予想を開始する</button>
        </div>
    </div>

    <div id="status"></div>
    <div id="output"></div>

    <script>
        // 初期値を今日の名前に設定
        window.onload = () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('targetDate').value = today;
        };

        async function fetchRaces() {
            const output = document.getElementById('output');
            const status = document.getElementById('status');
            const dateInput = document.getElementById('targetDate').value;
            
            if (!dateInput) {
                status.innerText = '日付を選択してください';
                return;
            }

            const formattedDate = dateInput.replace(/-/g, '/'); // YYYY/MM/DD 形式に変換
            output.innerHTML = '';
            status.innerText = `${dateInput} のデータを確認中...`;

            try {
                // APIエンドポイントの構築
                const url = `https://boatraceopenapi.github.io/programs/${formattedDate}/all.json`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error('該当日付のデータがまだ公開されていないか、存在しません');
                }
                
                const data = await response.json();
                status.innerText = '';
                
                if (data.length === 0) {
                    status.innerText = '本日の開催レースはありません。';
                    return;
                }

                data.forEach(stadium => {
                    let html = `<div class="card">
                        <div class="stadium-name">${stadium.stadiumName}</div>
                        <div class="race-grid">`;
                    
                    stadium.races.forEach(race => {
                        const pred = calculatePrediction(race.players);
                        html += `
                            <div class="race-item">
                                <div>第 ${race.raceNo} レース</div>
                                <div class="prediction">${pred}</div>
                            </div>`;
                    });

                    html += `</div></div>`;
                    output.innerHTML += html;
                });

            } catch (error) {
                status.innerText = 'エラー: ' + error.message;
                console.error(error);
            }
        }

        function calculatePrediction(players) {
            if (!players || players.length < 4) return "データ不足";

            let scores = players.map(p => ({
                no: p.bracketNo,
                val: (parseFloat(p.nationalWinRate) || 0) + (parseFloat(p.localWinRate) || 0)
            }));

            scores.sort((a, b) => b.val - a.val);
            const top = scores.slice(0, 4).map(s => s.no);
            
            // 1号艇がスコア最上位なら1頭固定、それ以外ならボックス気味に表示
            if (top[0] === 1) {
                return `1-${top[1]}${top[2]}-${top[1]}${top[2]}${top[3]}`;
            } else {
                return `${top[0]}-${top[1]}-${top[2]} 等`;
            }
        }
    </script>
</body>
</html>
