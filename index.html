<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPB 12球団選手名鑑 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .giants { border-left-color: #ff6600; }
        .tigers { border-left-color: #ffea00; }
        .baystars { border-left-color: #005596; }
        .carp { border-left-color: #ff0000; }
        .dragons { border-left-color: #002a86; }
        .swallows { border-left-color: #004631; }
        .hawks { border-left-color: #f6ca06; }
        .fighters { border-left-color: #006298; }
        .marines { border-left-color: #221815; }
        .buffaloes { border-left-color: #b19962; }
        .eagles { border-left-color: #870011; }
        .lions { border-left-color: #003567; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-950 text-white">

    <header class="p-4 bg-black sticky top-0 z-50 border-b border-gray-800">
        <h1 class="text-xl font-black italic text-center text-yellow-500">12-BALLPARK ENCYCLOPEDIA</h1>
        <div class="flex overflow-x-auto gap-2 mt-4 no-scrollbar pb-2">
            <button onclick="render('all')" class="flex-none px-4 py-1 bg-gray-800 rounded-full text-xs font-bold">ALL</button>
            <button onclick="render('giants')" class="flex-none px-4 py-1 bg-[#ff6600] text-black rounded-full text-xs font-bold">巨人</button>
            <button onclick="render('hawks')" class="flex-none px-4 py-1 bg-[#f6ca06] text-black rounded-full text-xs font-bold">SB</button>
            <button onclick="render('tigers')" class="flex-none px-4 py-1 bg-[#ffea00] text-black rounded-full text-xs font-bold">阪神</button>
            <button onclick="render('carp')" class="flex-none px-4 py-1 bg-[#ff0000] text-white rounded-full text-xs font-bold">広島</button>
            <button onclick="render('swallows')" class="flex-none px-4 py-1 bg-[#004631] text-white rounded-full text-xs font-bold">ヤクルト</button>
            <button onclick="render('baystars')" class="flex-none px-4 py-1 bg-[#005596] text-white rounded-full text-xs font-bold">横浜</button>
            <button onclick="render('dragons')" class="flex-none px-4 py-1 bg-[#002a86] text-white rounded-full text-xs font-bold">中日</button>
            <button onclick="render('fighters')" class="flex-none px-4 py-1 bg-[#006298] text-white rounded-full text-xs font-bold">日ハム</button>
            <button onclick="render('marines')" class="flex-none px-4 py-1 bg-[#221815] text-white rounded-full text-xs font-bold">ロッテ</button>
            <button onclick="render('buffaloes')" class="flex-none px-4 py-1 bg-[#b19962] text-black rounded-full text-xs font-bold">オリ</button>
            <button onclick="render('eagles')" class="flex-none px-4 py-1 bg-[#870011] text-white rounded-full text-xs font-bold">楽天</button>
            <button onclick="render('lions')" class="flex-none px-4 py-1 bg-[#003567] text-white rounded-full text-xs font-bold">西武</button>
        </div>
    </header>

    <main class="p-4 max-w-2xl mx-auto">
        <div id="player-grid" class="grid grid-cols-2 gap-2">
            </div>
    </main>

    <div id="modal" class="fixed inset-0 bg-black/98 z-[100] hidden flex flex-col p-4 overflow-y-auto">
        <button onclick="closeModal()" class="self-end text-4xl p-2 font-light">&times;</button>
        <div id="m-content" class="max-w-md mx-auto w-full">
            <h2 id="m-name" class="text-4xl font-black mb-1 text-center italic"></h2>
            <div id="m-team" class="text-center text-xs font-bold text-gray-500 mb-6">TEAM INFO</div>
            <div class="bg-white/5 p-6 rounded-3xl mb-4 text-sm leading-relaxed text-gray-300" id="m-wiki">取得中...</div>
            <div class="text-center"><a id="m-link" href="#" target="_blank" class="text-xs text-blue-400 underline">Wikipediaでさらに詳しく見る</a></div>
        </div>
    </div>

    <script>
        const PLAYERS = [
            // 巨人
            {name:"坂本勇人", team:"giants"}, {name:"岡本和真", team:"giants"}, {name:"吉川尚輝", team:"giants"}, {name:"門脇誠", team:"giants"}, {name:"丸佳浩", team:"giants"}, {name:"戸郷翔征", team:"giants"}, {name:"大城卓三", team:"giants"}, {name:"菅野智之", team:"giants"}, {name:"山﨑伊織", team:"giants"}, {name:"秋広優人", team:"giants"},
            // ソフトバンク
            {name:"柳田悠岐", team:"hawks"}, {name:"周東佑京", team:"hawks"}, {name:"栗原陵矢", team:"hawks"}, {name:"山川穂高", team:"hawks"}, {name:"今宮健太", team:"hawks"}, {name:"近藤健介", team:"hawks"}, {name:"中村晃", team:"hawks"}, {name:"牧原大成", team:"hawks"}, {name:"有原航平", team:"hawks"}, {name:"オスナ", team:"hawks"},
            // 阪神
            {name:"近本光司", team:"tigers"}, {name:"中野拓夢", team:"tigers"}, {name:"佐藤輝明", team:"tigers"}, {name:"大山悠輔", team:"tigers"}, {name:"森下翔太", team:"tigers"}, {name:"木浪聖也", team:"tigers"}, {name:"村上頌樹", team:"tigers"}, {name:"伊藤将司", team:"tigers"}, {name:"才木浩人", team:"tigers"}, {name:"岩崎優", team:"tigers"},
            // 広島
            {name:"菊池涼介", team:"carp"}, {name:"野間峻祥", team:"carp"}, {name:"秋山翔吾", team:"carp"}, {name:"小園海斗", team:"carp"}, {name:"坂倉将吾", team:"carp"}, {name:"堂林翔太", team:"carp"}, {name:"九里亜蓮", team:"carp"}, {name:"森下暢仁", team:"carp"}, {name:"床田寛樹", team:"carp"}, {name:"栗林良吏", team:"carp"},
            // 横浜
            {name:"牧秀悟", team:"baystars"}, {name:"佐野恵太", team:"baystars"}, {name:"宮﨑敏郎", team:"baystars"}, {name:"度会隆輝", team:"baystars"}, {name:"桑原将志", team:"baystars"}, {name:"東克樹", team:"baystars"}, {name:"山﨑康晃", team:"baystars"}, {name:"山本祐大", team:"baystars"}, {name:"筒香嘉智", team:"baystars"}, {name:"今永昇太", team:"baystars"},
            // 中日
            {name:"細川成也", team:"dragons"}, {name:"岡林勇希", team:"dragons"}, {name:"石川昂弥", team:"dragons"}, {name:"中田翔", team:"dragons"}, {name:"大島洋平", team:"dragons"}, {name:"柳裕也", team:"dragons"}, {name:"高橋宏斗", team:"dragons"}, {name:"小笠原慎之介", team:"dragons"}, {name:"ライデル・マルティネス", team:"dragons"}, {name:"村松開人", team:"dragons"},
            // ヤクルト
            {name:"村上宗隆", team:"swallows"}, {name:"山田哲人", team:"swallows"}, {name:"塩見泰隆", team:"swallows"}, {name:"サンタナ", team:"swallows"}, {name:"オスナ", team:"swallows"}, {name:"長岡秀樹", team:"swallows"}, {name:"小川泰弘", team:"swallows"}, {name:"田口麗斗", team:"swallows"}, {name:"吉村貢司郎", team:"swallows"}, {name:"清水昇", team:"swallows"},
            // オリックス
            {name:"宮城大弥", team:"buffaloes"}, {name:"中川圭太", team:"buffaloes"}, {name:"森友哉", team:"buffaloes"}, {name:"杉本裕太郎", team:"buffaloes"}, {name:"宗佑磨", team:"buffaloes"}, {name:"紅林弘太郎", team:"buffaloes"}, {name:"西野真弘", team:"buffaloes"}, {name:"平野佳寿", team:"buffaloes"}, {name:"山下舜平大", team:"buffaloes"}, {name:"東晃平", team:"buffaloes"},
            // ロッテ
            {name:"佐々木朗希", team:"marines"}, {name:"藤原恭大", team:"marines"}, {name:"安田尚憲", team:"marines"}, {name:"山口航輝", team:"marines"}, {name:"ポランコ", team:"marines"}, {name:"藤岡裕大", team:"marines"}, {name:"小島和哉", team:"marines"}, {name:"種市篤暉", team:"marines"}, {name:"益田直也", team:"marines"}, {name:"友杉篤輝", team:"marines"},
            // 日ハム
            {name:"万波中正", team:"fighters"}, {name:"清宮幸太郎", team:"fighters"}, {name:"野村佑希", team:"fighters"}, {name:"松本剛", team:"fighters"}, {name:"伊藤大海", team:"fighters"}, {name:"山﨑福也", team:"fighters"}, {name:"加藤貴之", team:"fighters"}, {name:"田中正義", team:"fighters"}, {name:"伏見寅威", team:"fighters"}, {name:"田宮裕涼", team:"fighters"},
            // 楽天
            {name:"浅村栄斗", team:"eagles"}, {name:"小郷裕哉", team:"eagles"}, {name:"辰己涼介", team:"eagles"}, {name:"島内宏明", team:"eagles"}, {name:"鈴木大地", team:"eagles"}, {name:"則本昂大", team:"eagles"}, {name:"岸孝之", team:"eagles"}, {name:"早川隆久", team:"eagles"}, {name:"村林一輝", team:"eagles"}, {name:"阿部寿樹", team:"eagles"},
            // 西武
            {name:"源田壮亮", team:"lions"}, {name:"外崎修汰", team:"lions"}, {name:"今井達也", team:"lions"}, {name:"髙橋光成", team:"lions"}, {name:"平良海馬", team:"lions"}, {name:"栗山巧", team:"lions"}, {name:"中村剛也", team:"lions"}, {name:"佐藤龍世", team:"lions"}, {name:"古賀悠斗", team:"lions"}, {name:"隅田知一郎", team:"lions"}
        ];

        function render(filter) {
            const grid = document.getElementById('player-grid');
            grid.innerHTML = '';
            const list = filter === 'all' ? PLAYERS : PLAYERS.filter(p => p.team === filter);
            list.forEach(p => {
                const b = document.createElement('button');
                b.className = `p-3 rounded-lg bg-gray-900 border-l-4 ${p.team} text-left text-sm font-bold active:scale-95 transition-all`;
                b.innerText = p.name;
                b.onclick = () => openModal(p);
                grid.appendChild(b);
            });
        }

        async function openModal(p) {
            document.getElementById('m-name').innerText = p.name;
            document.getElementById('m-team').innerText = p.team.toUpperCase();
            document.getElementById('m-wiki').innerText = "読み込み中...";
            document.getElementById('m-link').href = `https://ja.wikipedia.org/wiki/${encodeURIComponent(p.name)}`;
            document.getElementById('modal').classList.remove('hidden');

            try {
                const res = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(p.name)}`);
                const data = await res.json();
                document.getElementById('m-wiki').innerText = data.extract || "情報なし";
            } catch {
                document.getElementById('m-wiki').innerText = "取得失敗";
            }
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        render('all');
    </script>
</body>
</html>
