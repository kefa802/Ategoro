<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロ野球応援歌名鑑 100</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .giants { border-color: #ff6600; }
        .hawks { border-color: #f6ca06; }
        .tigers { border-color: #ffe200; }
        .carp { border-color: #ff0000; }
        .dragons { border-color: #002a86; }
        .baystars { border-color: #005596; }
        .swallows { border-color: #004631; }
        .buffaloes { border-color: #b19962; }
        .marines { border-color: #221815; }
        .lions { border-color: #003567; }
        .fighters { border-color: #006298; }
        .eagles { border-color: #870011; }
    </style>
</head>
<body class="bg-gray-950 text-white pb-10">

    <header class="p-6 bg-black text-center sticky top-0 z-50 border-b border-gray-800">
        <h1 class="text-2xl font-black italic tracking-tighter text-yellow-500">12-BALLPARK ENCYCLOPEDIA</h1>
        <p class="text-[10px] text-gray-500 mt-1">100+ Players & Cheer Songs</p>
    </header>

    <main class="p-4 max-w-2xl mx-auto">
        <div class="flex overflow-x-auto gap-2 mb-6 py-2 no-scrollbar">
            <button onclick="renderList('all')" class="flex-none px-4 py-2 bg-gray-800 rounded-full text-xs font-bold">ALL</button>
            <button onclick="renderList('giants')" class="flex-none px-4 py-2 bg-[#ff6600] text-black rounded-full text-xs font-bold">巨人</button>
            <button onclick="renderList('hawks')" class="flex-none px-4 py-2 bg-[#f6ca06] text-black rounded-full text-xs font-bold">SB</button>
            <button onclick="renderList('tigers')" class="flex-none px-4 py-2 bg-[#ffe200] text-black rounded-full text-xs font-bold">阪神</button>
            </div>

        <div id="player-grid" class="grid grid-cols-1 gap-3">
            </div>
    </main>

    <div id="modal" class="fixed inset-0 bg-black/98 z-[100] hidden flex flex-col p-4 overflow-y-auto">
        <button onclick="closeModal()" class="self-end text-4xl p-2 font-light">&times;</button>
        <div id="m-content" class="max-w-md mx-auto w-full">
            <h2 id="m-name" class="text-4xl font-black italic mb-2 text-center"></h2>
            <div id="m-team" class="text-center text-xs font-bold mb-6 text-gray-400 tracking-widest"></div>
            
            <div class="space-y-6">
                <div class="bg-white/5 p-5 rounded-3xl">
                    <h3 class="text-[10px] font-bold text-yellow-500 mb-2">WIKIPEDIA SUMMARY</h3>
                    <p id="m-wiki" class="text-sm leading-relaxed text-gray-300">取得中...</p>
                </div>
                <div class="bg-blue-600/10 p-5 rounded-3xl border border-blue-500/30">
                    <h3 class="text-[10px] font-bold text-blue-400 mb-2">CHEER SONG</h3>
                    <p id="m-lyrics" class="text-lg font-bold text-center italic">応援歌データ準備中</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 100人以上のデータ（ここを増やすだけでOK）
        const PLAYERS = [
            { name: "坂本勇人", team: "giants", class: "giants" },
            { name: "岡本和真", team: "giants", class: "giants" },
            { name: "吉川尚輝", team: "giants", class: "giants" },
            { name: "門脇誠", team: "giants", class: "giants" },
            { name: "戸郷翔征", team: "giants", class: "giants" },
            { name: "柳田悠岐", team: "hawks", class: "hawks" },
            { name: "周東佑京", team: "hawks", class: "hawks" },
            { name: "栗原陵矢", team: "hawks", class: "hawks" },
            { name: "山川穂高", team: "hawks", class: "hawks" },
            { name: "今宮健太", team: "hawks", class: "hawks" },
            { name: "佐藤輝明", team: "tigers", class: "tigers" },
            { name: "近本光司", team: "tigers", class: "tigers" },
            { name: "村上宗隆", team: "swallows", class: "swallows" },
            // ... ここに名前を100人分までコピペで増やせます
        ];

        // 応援歌の簡易DB（実際には外部JSON推奨）
        const LYRICS = {
            "坂本勇人": "オオオ... 燃えろ 燃えろ 坂本！",
            "柳田悠岐": "光り輝く 舞台を駆け抜けろ",
            "村上宗隆": "選ばれし猛者よ 立ち向かえ"
        };

        function renderList(filter) {
            const grid = document.getElementById('player-grid');
            grid.innerHTML = '';
            
            const list = filter === 'all' ? PLAYERS : PLAYERS.filter(p => p.team === filter);

            list.forEach(p => {
                const btn = document.createElement('button');
                btn.className = `p-4 rounded-2xl bg-gray-900 border-l-4 ${p.class} text-left flex justify-between items-center group active:scale-95 transition-all`;
                btn.innerHTML = `
                    <span class="font-bold text-lg">${p.name}</span>
                    <span class="text-[10px] text-gray-600 group-hover:text-gray-400">DETAIL →</span>
                `;
                btn.onclick = () => openModal(p);
                grid.appendChild(btn);
            });
        }

        async function openModal(player) {
            document.getElementById('m-name').innerText = player.name;
            document.getElementById('m-team').innerText = player.team.toUpperCase();
            document.getElementById('m-lyrics').innerText = LYRICS[player.name] || "（応援歌未登録）";
            document.getElementById('m-wiki').innerText = "Wikipediaから情報を取得しています...";
            document.getElementById('modal').classList.remove('hidden');

            try {
                const res = await fetch(`https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(player.name)}`);
                const data = await response = await res.json();
                document.getElementById('m-wiki').innerText = data.extract || "詳細情報が見つかりませんでした。";
            } catch {
                document.getElementById('m-wiki').innerText = "Wikipediaデータの取得に失敗しました。";
            }
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        // 初期表示
        renderList('all');
    </script>
</body>
</html>
