<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OANDA Pro Trading UI</title>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background-color: #0b101e; color: #ffffff; overflow: hidden; }
        .container { display: flex; flex-direction: column; height: 100vh; }
        
        #settingsArea { padding: 15px; background-color: #1a202c; border-bottom: 1px solid #2d3748; }
        input[type="text"] { width: calc(100% - 20px); padding: 10px; margin-bottom: 10px; background: #2d3748; border: 1px solid #4a5568; color: white; border-radius: 4px; }
        .btn-save { width: 100%; padding: 12px; background-color: #4a5568; color: white; border: none; border-radius: 4px; font-weight: bold; }
        
        .header { display: flex; justify-content: space-between; padding: 6px 10px; background-color: #161b26; border-bottom: 1px solid #2d3748; font-size: 13px; }
        
        /* チャートエリア */
        #chartWrapper { height: 28vh; min-height: 160px; width: 100%; border-bottom: 1px solid #2d3748; position: relative; background: #0b101e; }
        #instrumentSelector { position: absolute; top: 5px; left: 5px; z-index: 10; background: #1a202c; color: white; border: 1px solid #4a5568; padding: 4px; border-radius: 4px; font-size: 12px; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        
        /* ポジションダッシュボード */
        .pos-dashboard { display: flex; background-color: #161b26; padding: 5px; gap: 5px; }
        .pos-side { flex: 1; padding: 6px; border-radius: 4px; font-size: 11px; display: flex; flex-direction: column; align-items: center; }
        .pos-sell { border: 1px solid #3b82f6; background: rgba(59, 130, 246, 0.05); }
        .pos-buy { border: 1px solid #ef4444; background: rgba(239, 68, 68, 0.05); }
        .btn-close-small { padding: 3px 12px; font-size: 10px; border: none; border-radius: 3px; cursor: pointer; margin-top: 6px; background: #475569; color: white; }

        /* 注文パネル */
        .order-panel { padding: 8px 10px; background-color: #161b26; border-bottom: 1px solid #2d3748; }
        .trade-buttons { display: flex; gap: 10px; }
        .btn-trade { flex: 1; padding: 8px; border: none; border-radius: 6px; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .btn-sell-small { background: #3b82f6; }
        .btn-buy-small { background: #ef4444; }
        .btn-price { font-size: 18px; font-weight: bold; }
        
        .history-panel { flex: 1; padding: 5px 10px; background-color: #0b101e; font-size: 11px; overflow-y: auto; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="settingsArea">
        <input type="text" id="apiKeyInput" placeholder="OANDA APIトークン">
        <button id="saveBtn" class="btn-save">保存</button>
    </div>

    <div id="mainUI" class="container hidden">
        <div class="header">
            <div>残高: <span id="balanceVal">--</span></div>
            <div>含み損益: <span id="plVal">--</span></div>
        </div>

        <div id="chartWrapper">
            <select id="instrumentSelector">
                <option value="USD_JPY">USD/JPY</option>
                <option value="EUR_JPY">EUR/JPY</option>
                <option value="GBP_JPY">GBP/JPY</option>
                <option value="EUR_USD">EUR/USD</option>
                <option value="USD_CHF">USD/CHF</option>
            </select>
            <canvas id="myCanvas"></canvas>
        </div>

        <div class="pos-dashboard">
            <div class="pos-side pos-sell">
                <div style="color:#60a5fa; font-weight:bold;">SELL</div>
                <div id="shortUnits">0</div>
                <div id="shortPL">損益: 0</div>
                <div id="shortPips" style="color: #60a5fa;">Pip: 0</div>
                <button id="btnSideCloseShort" class="btn-close-small">全決済</button>
            </div>
            <div class="pos-side pos-buy">
                <div style="color:#f87171; font-weight:bold;">BUY</div>
                <div id="longUnits">0</div>
                <div id="longPL">損益: 0</div>
                <div id="longPips" style="color: #f87171;">Pip: 0</div>
                <button id="btnSideCloseLong" class="btn-close-small">全決済</button>
            </div>
        </div>

        <div class="order-panel">
            <div class="trade-buttons">
                <button id="btnSell" class="btn-trade btn-sell-small">
                    <div style="font-size:10px;">BID | 売</div>
                    <div id="bidPrice" class="btn-price">---.---</div>
                </button>
                <button id="btnBuy" class="btn-trade btn-buy-small">
                    <div style="font-size:10px;">ASK | 買</div>
                    <div id="askPrice" class="btn-price">---.---</div>
                </button>
            </div>
        </div>
        <div class="history-panel" id="historyList"></div>
    </div>

    <script>
        // 通貨ペア選択時の処理
        document.getElementById('instrumentSelector').addEventListener('change', (e) => {
            instrument = e.target.value;
            // リセットして再読み込み
            candlesData = [];
            initApp();
        });
        
        // 残りは既存のロジックをベースにPip計算を追加すれば完璧です
    </script>
</body>
</html>
