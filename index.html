<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>当五郎 - 競艇全場予想</title>
    <style>
        body { font-family: sans-serif; background: #eceff1; margin: 0; padding: 0; }
        .header { background: #01579b; color: white; padding: 20px; text-align: center; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .controls { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input[type="date"] { padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 1rem; margin-bottom: 10px; width: 80%; }
        button { padding: 12px 25px; background: #ffc107; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 80%; }
        .stadium-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 20px; border-left: 8px solid #01579b; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .stadium-name { font-size: 1.3rem; font-weight: bold; color: #333; border-bottom: 2px solid #eee; padding-bottom: 5px; margin-bottom: 10px; }
        .race-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
        .race-item { background: #f9f9f9; border: 1px solid #ddd; padding: 8px; border-radius: 5px; text-align: center; }
        .prediction { color: #007bff; font-weight: bold; display: block; }
        .btn-official { display: inline-block; margin-top: 10px; padding: 8px 15px; background: #e1f5fe; color: #01579b; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0;">当五郎</h1>
    <p style="margin:5px 0 0; opacity:0.8;">全場自動予想 & 公式直結リンク</p>
</div>

<div class="container">
    <div class="controls">
        <input type="date" id="targetDate">
        <button onclick="startApp()">表示を開始する</button>
    </div>
    <div id="status"></div>
    <div id="output"></div>
</div>

<script>
    const stadiums = [
        {id:'01', n:'桐生'}, {id:'02', n:'戸田'}, {id:'03', n:'江戸川'}, {id:'04', n:'平和島'}, {id:'05', n:'多摩川'},
        {id:'06', n:'浜名湖'}, {id:'07', n:'蒲郡'}, {id:'08', n:'常滑'}, {id:'09', n:'津'}, {id:'10', n:'三国'},
        {id:'11', n:'琵琶湖'}, {id:'12', n:'尼崎'}, {id:'13', n:'鳴門'}, {id:'14', n:'丸亀'}, {id:'15', n:'児島'},
        {id:'16', n:'宮島'}, {id:'17', n:'徳山'}, {id:'18', n:'下関'}, {id:'19', n:'若松'}, {id:'20', n:'芦屋'},
        {id:'21', n:'福岡'}, {id:'22', n:'唐津'}, {id:'23', n:'大村'}, {id:'24', n:'多摩川'}
    ];

    window.onload = () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('targetDate').value = today;
    };

    async function startApp() {
        const dateInput = document.getElementById('targetDate').value;
        const ymd = dateInput.replace(/-/g, '');
        const output = document.getElementById('output');
        const status = document.getElementById('status');
        output.innerHTML = '';
        status.innerText = 'データを読み込み中...';

        try {
            // APIにデータがあるか確認
            const response = await fetch(`https://boatraceopenapi.github.io/programs/${ymd}/all.json`);
            if(!response.ok) throw new Error();
            const data = await response.json();
            status.innerText = '';

            data.forEach(s => {
                let raceHtml = '';
                s.races.forEach(r => {
                    raceHtml += `<div class="race-item"><small>${r.raceNo}R</small><span class="prediction">${generateLogic(r.players)}</span></div>`;
                });
                renderCard(s.stadiumName, raceHtml, s.stadiumId, ymd);
            });
        } catch (e) {
            // データがない場合は、24会場すべての公式リンクを表示（バックアップモード）
            status.innerHTML = '<p style="color:#666;">詳細データが未着のため、全会場の公式リンクを表示します。</p>';
            stadiums.forEach(s => {
                const link = `<a href="https://www.boatrace.jp/owpc/pc/race/raceindex?jcd=${s.id}&hd=${ymd}" target="_blank" class="btn-official">公式出走表を開く</a>`;
                renderCard(s.n, link);
            });
        }
    }

    function renderCard(name, content, id = '', ymd = '') {
        const div = document.createElement('div');
        div.className = 'stadium-card';
        div.innerHTML = `<div class="stadium-name">${name}</div><div class="race-list">${content}</div>`;
        document.getElementById('output').appendChild(div);
    }

    function generateLogic(players) {
        if(!players) return "---";
        let list = players.map(p => ({no: p.bracketNo, s: (parseFloat(p.nationalWinRate)||0)*0.7 + (parseFloat(p.localWinRate)||0)*0.3}));
        list.sort((a,b) => b.s - a.s);
        const top = list.map(l => l.no);
        return top[0] === 1 ? `1-${top[1]}${top[2]}-全` : `${top[0]}-${top[1]}-${top[2]}`;
    }
</script>
</body>
</html>
