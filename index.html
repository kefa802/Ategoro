<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>当五郎</title>
    <style>
        :root { --blue: #01579b; --gold: #ffc107; --bg: #f0f2f5; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 0; }
        .header { background: var(--blue); color: white; padding: 15px; text-align: center; }
        .container { padding: 10px; max-width: 600px; margin: auto; }
        .box { background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px;}
        .btn { background: var(--gold); border: none; padding: 15px; border-radius: 30px; font-weight: bold; width: 90%; cursor: pointer; font-size: 1.1rem; }
        .card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; border-left: 6px solid var(--blue); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .race-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .race-box { background: #f8f9fa; border: 1px solid #eee; padding: 10px 5px; border-radius: 6px; text-align: center; }
        .pred { color: #d32f2f; font-weight: bold; font-size: 0.95rem; display: block; margin-top: 5px; }
    </style>
</head>
<body>
<div class="header"><h1>当五郎</h1></div>
<div class="container">
    <div class="box">
        <input type="date" id="targetDate" style="padding:12px; width:80%; margin-bottom:15px; border-radius:8px; border:1px solid #ccc;">
        <button class="btn" onclick="fetchData()">予想を開始する</button>
    </div>
    <div id="status" style="text-align:center; font-weight:bold; margin-bottom:10px;"></div>
    <div id="output"></div>
</div>

<script>
    window.onload = () => {
        document.getElementById('targetDate').value = new Date().toISOString().split('T')[0];
    };

    async function fetchData() {
        const ymd = document.getElementById('targetDate').value.replace(/-/g, '');
        const status = document.getElementById('status');
        const output = document.getElementById('output');
        
        status.innerText = '🚀 データを解析中...';
        output.innerHTML = '';

        // Google(GAS)を通さず、直接GitHub上のデータを取りに行く
        const url = `https://boatraceopenapi.github.io/programs/${ymd}/all.json`;

        try {
            const res = await fetch(url);
            const data = await res.json();
            
            if (!data || data.length === 0) {
                status.innerText = '⚠️ 本日のデータがまだ準備されていません。';
                return;
            }
            
            status.innerText = `✅ ${data.length}会場を表示します`;
            data.forEach(st => {
                let grid = '';
                st.races.forEach(r => {
                    grid += `<div class="race-box"><small>${r.raceNo}R</small><span class="pred">${predict(r.players)}</span></div>`;
                });
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div style="font-weight:bold;color:var(--blue);">${st.stadiumName}</div><div class="race-grid">${grid}</div>`;
                output.appendChild(card);
            });
        } catch (e) {
            status.innerText = '❌ 取得エラー。しばらく待ってから再度お試しください。';
        }
    }

    function predict(players) {
        if (!players) return "---";
        let p = players.map(x => ({n: x.bracketNo, s: (parseFloat(x.nationalWinRate)||0)*0.8 + (parseFloat(x.localWinRate)||0)*0.2})).sort((a,b) => b.s - a.s);
        return p[0].n === 1 ? `1-${p[1].n}${p[2].n}-全` : `${p[0].n}-${p[1].n}-${p[2].n}`;
    }
</script>
</body>
</html>
