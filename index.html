<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私だけのYouTubeプレイヤー</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #ff0000; }
        button { background-color: #1a73e8; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; margin: 10px; }
        button:hover { background-color: #1557b0; }
        .hidden { display: none; }
        input[type="text"] { width: 80%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        #player-container { margin-top: 20px; position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        #player-container iframe, #player-container div { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .user-info { font-size: 14px; color: #555; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Custom YouTube Player</h1>

    <!-- 1. ログイン前の画面 -->
    <div id="login-section">
        <p>このアプリを使用するにはログインが必要です。</p>
        <button id="btn-login">Googleアカウントでログイン</button>
    </div>

    <!-- 2. ログイン後の画面 -->
    <div id="app-section" class="hidden">
        <div class="user-info">
            ようこそ、<span id="user-name"></span> さん！
            <button id="btn-logout" style="background-color: #555; padding: 5px 10px; font-size: 12px;">ログアウト</button>
        </div>

        <div class="input-group">
            <input type="text" id="playlist-id" placeholder="YouTubeプレイリストIDを入力">
            <button id="btn-load">読み込み</button>
        </div>

        <div id="player-container">
            <div id="player"></div>
        </div>
    </div>
</div>

<!-- Firebase SDK の読み込み (v10) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithRedirect, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // 工藤さんのFirebaseプロジェクト設定
    const firebaseConfig = {
      apiKey: "AIzaSyAq1rVSsjLcQHPiMJqd2-wAsG4S-gweqS4",
      authDomain: "play-837e1.firebaseapp.com",
      projectId: "play-837e1",
      storageBucket: "play-837e1.firebasestorage.app",
      messagingSenderId: "701724944383",
      appId: "1:701724944383:web:c34c0d7b453bcee96729ca",
      measurementId: "G-2JCCWYCESK"
    };

    // Firebaseの初期化
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // UI要素の取得
    const loginSection = document.getElementById('login-section');
    const appSection = document.getElementById('app-section');
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const userName = document.getElementById('user-name');
    const playlistInput = document.getElementById('playlist-id');
    const btnLoad = document.getElementById('btn-load');

    // ログイン処理（スマホでブロックされないリダイレクト方式）
    btnLogin.addEventListener('click', () => {
        signInWithRedirect(auth, provider);
    });

    // ログアウト処理
    btnLogout.addEventListener('click', () => {
        signOut(auth);
    });

    // ログイン状態の監視
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // ログイン中
            loginSection.classList.add('hidden');
            appSection.classList.remove('hidden');
            userName.textContent = user.displayName;
        } else {
            // ログアウト中
            loginSection.classList.remove('hidden');
            appSection.classList.add('hidden');
            if (player) player.destroy();
        }
    });

    // YouTube IFrame APIの制御
    let player;
    
    window.loadPlaylist = function() {
        const playlistId = playlistInput.value.trim();
        if (!playlistId) {
            alert("プレイリストIDを入力してください");
            return;
        }

        if (player) {
            player.destroy();
        }

        player = new YT.Player('player', {
            height: '100%',
            width: '100%',
            playerVars: {
                'listType': 'playlist',
                'list': playlistId
            }
        });
    }

    btnLoad.addEventListener('click', window.loadPlaylist);
</script>

<!-- YouTube IFrame API の読み込み -->
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
