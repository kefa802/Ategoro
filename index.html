<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <header class="bg-black text-white p-4 sticky top-0 z-50 text-center">
        <h1 class="text-xl font-black italic tracking-tighter">SPORTS QUICK VIEW</h1>
    </header>

    <main class="p-2 space-y-3" id="feed-container">
        <div id="status" class="text-center py-20 text-gray-400 text-sm">読み込み中...</div>
    </main>

    <script>
        // YahooニュースのJSON形式データ（RSSより安定して取得できる場合があります）
        const CATEGORIES = [
            { name: 'プロ野球', id: 'base' },
            { name: 'F1', id: 'motor' },
            { name: 'Jリーグ', id: 'socc' }
        ];

        async function loadNews() {
            const container = document.getElementById('feed-container');
            const status = document.getElementById('status');

            try {
                // yqlやrss2jsonなどが不安定なため、
                // 最もシンプルな「rss2json」の別エンドポイントを使用
                const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=https://news.yahoo.co.jp/rss/categories/sports.xml&api_key=00000000000000000000000000000000`);
                const data = await response.json();

                if (data.status === 'ok') {
                    status.remove();
                    data.items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 active:scale-[0.98] transition-transform";
                        card.onclick = () => window.location.href = item.link;
                        
                        // ジャンル判定（簡易）
                        let badgeColor = "bg-gray-500";
                        if(item.title.includes("F1")) badgeColor = "bg-red-600";
                        if(item.title.includes("J1") || item.title.includes("Jリーグ")) badgeColor = "bg-green-600";
                        if(item.title.includes("巨") || item.title.includes("阪神") || item.title.includes("野球")) badgeColor = "bg-blue-800";

                        card.innerHTML = `
                            <div class="flex items-center gap-2 mb-1">
                                <span class="${badgeColor} text-white text-[10px] px-2 py-0.5 rounded-full font-bold">NEWS</span>
                            </div>
                            <h2 class="font-bold text-gray-800 leading-tight">${item.title}</h2>
                        `;
                        container.appendChild(card);
                    });
                }
            } catch (e) {
                status.innerText = "再読み込みしてください。";
            }
        }

        loadNews();
    </script>
</body>
</html>
