<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OANDA 自作チャート スキャルピング</title>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background-color: #0b101e; color: #ffffff; overflow: hidden; }
        .container { display: flex; flex-direction: column; height: 100vh; }
        
        #settingsArea { padding: 15px; background-color: #1a202c; border-bottom: 1px solid #2d3748; }
        input[type="text"], input[type="number"] { background: #2d3748; border: 1px solid #4a5568; color: white; border-radius: 4px; padding: 8px; }
        input[type="text"] { width: calc(100% - 20px); margin-bottom: 10px; padding: 10px; }
        .btn-save { width: 100%; padding: 12px; background-color: #4a5568; color: white; border: none; border-radius: 4px; font-weight: bold; }
        
        .header { display: flex; justify-content: space-between; padding: 8px 15px; background-color: #161b26; border-bottom: 1px solid #2d3748; font-size: 14px; }
        .header span { font-weight: bold; color: #a0aec0; }
        .header .val { color: #ffffff; font-size: 16px; }

        /* チャートエリア */
        #chartWrapper { height: 30vh; min-height: 180px; width: 100%; border-bottom: 1px solid #2d3748; position: relative; background: #0b101e; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        #marketClosedLabel { position: absolute; top: 10px; left: 10px; background: rgba(220, 38, 38, 0.8); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; display: none; }

        /* 手動注文パネル */
        .order-panel { padding: 10px 15px; background-color: #161b26; border-bottom: 1px solid #2d3748; }
        .pos-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed #2d3748; }
        .btn-close-all { background: #475569; color: white; border: none; padding: 6px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-close-all:active { opacity: 0.8; }
        
        .lot-selector { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; }
        .lot-selector select { background: #2d3748; color: white; border: 1px solid #4a5568; padding: 8px; border-radius: 4px; }
        
        .trade-buttons { display: flex; justify-content: space-between; gap: 10px; }
        .btn-trade { flex: 1; padding: 12px 10px; border: none; border-radius: 8px; font-size: 20px; font-weight: bold; color: white; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .btn-sell { background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%); }
        .btn-buy { background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%); }
        .btn-trade:active { opacity: 0.8; transform: translateY(2px); }
        .btn-label { font-size: 12px; margin-bottom: 2px; opacity: 0.9; }
        .btn-price { font-size: 24px; letter-spacing: 1px; }

        /* 自動売買パネル */
        .auto-panel { padding: 10px 15px; background-color: #1e293b; border-bottom: 1px solid #2d3748; }
        .auto-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; }
        .auto-controls { display: flex; gap: 10px; }
        .btn-auto { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; }
        .btn-auto.start { background: #10b981; } /* 緑 */
        .btn-auto.stop { background: #ef4444; } /* 赤 */
        .btn-auto:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; opacity: 0.5; }
        
        /* 履歴パネル */
        .history-panel { flex: 1; padding: 10px 15px; background-color: #0b101e; font-size: 12px; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1a202c; }
        .hist-sell { color: #60a5fa; font-weight: bold; }
        .hist-buy { color: #f87171; font-weight: bold; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="settingsArea">
        <input type="text" id="apiKeyInput" placeholder="OANDA APIトークンを入力">
        <button id="saveBtn" class="btn-save">APIキーを保存して開始</button>
    </div>

    <div id="mainUI" class="container hidden">
        <div class="header">
            <div><span>残高:</span> <span id="balanceVal" class="val">--</span><span> 円</span></div>
            <div><span>含み損益:</span> <span id="plVal" class="val">--</span><span> 円</span></div>
        </div>

        <div id="chartWrapper">
            <div id="marketClosedLabel">市場休場中</div>
            <canvas id="myCanvas"></canvas>
        </div>

        <div class="order-panel">
            <!-- ① ポジション表示と ② 全決済ボタン -->
            <div class="pos-row">
                <span>保有ポジション: <strong id="posVal" style="font-size: 16px;">0 通貨</strong></span>
                <button id="btnCloseAll" class="btn-close-all">全決済</button>
            </div>

            <div class="lot-selector">
                <span>通貨ペア: <strong>USD/JPY</strong></span>
                <div>
                    手動数量: 
                    <select id="lotSize">
                        <option value="1">1通貨</option>
                        <option value="1000">1,000通貨</option>
                        <option value="10000">10,000通貨</option>
                    </select>
                </div>
            </div>
            <div class="trade-buttons">
                <button id="btnSell" class="btn-trade btn-sell">
                    <span class="btn-label">BID | 売</span>
                    <span id="bidPrice" class="btn-price">---.---</span>
                </button>
                <button id="btnBuy" class="btn-trade btn-buy">
                    <span class="btn-label">ASK | 買</span>
                    <span id="askPrice" class="btn-price">---.---</span>
                </button>
            </div>
        </div>

        <!-- ③ 自動売買コントロールパネル -->
        <div class="auto-panel">
            <div class="auto-header">
                <span style="font-weight:bold; color:#cbd5e1;">🤖 自動売買</span>
                <div>
                    ロット: <input type="number" id="autoLot" min="0.01" max="1.00" step="0.01" value="0.01" style="width: 60px; text-align: center;"> 
                    <span style="color: #a0aec0; font-size: 11px;">(1.00=10万通貨)</span>
                </div>
            </div>
            <div class="auto-controls">
                <button id="btnAutoStart" class="btn-auto start">▶ スタート</button>
                <button id="btnAutoStop" class="btn-auto stop" disabled>■ ストップ</button>
            </div>
        </div>

        <div class="history-panel">
            <div style="color: #a0aec0; margin-bottom: 5px; position: sticky; top: 0; background: #0b101e; padding-bottom: 5px;">直近の取引履歴</div>
            <div id="historyList">履歴はありません</div>
        </div>
    </div>

    <script>
        const accountId = "001-009-11732183-002";
        const baseUrl = "https://api-fxtrade.oanda.com/v3";
        const instrument = "USD_JPY";
        let apiToken = "";
        
        let candlesData = [];
        let txHistoryData = [];
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const CANDLE_INTERVAL_SEC = 5; 
        
        let displayCount = 200;
        let yScaleMultiplier = 1.0; 
        let scrollOffset = 0;
        
        const yAxisWidth = 55;
        const xAxisHeight = 20;
        
        let initialPinchDist = null;
        let initialDisplayCount = 200;
        let initialYScale = 1.0;
        let isDragging = false;
        let lastTouchX = 0;

        // ポジションと自動売買の管理変数
        let currentNetPosition = 0; // 保有ポジション（プラスは買、マイナスは売）
        let isAutoTrading = false;  // 自動売買の稼働フラグ

        window.onload = () => {
            apiToken = localStorage.getItem('oanda_lion_key');
            if (apiToken) {
                document.getElementById('settingsArea').classList.add('hidden');
                document.getElementById('mainUI').classList.remove('hidden');
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
                setupTouchEvents();
                setupAutoTradeEvents();
                initApp();
            }
        };

        document.getElementById('saveBtn').addEventListener('click', () => {
            const inputKey = document.getElementById('apiKeyInput').value.trim();
            if (inputKey) {
                localStorage.setItem('oanda_lion_key', inputKey);
                location.reload();
            }
        });

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            drawChart();
        }

        function setupTouchEvents() {
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    lastTouchX = e.touches[0].clientX;
                } else if (e.touches.length === 2) {
                    isDragging = false;
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    initialPinchDist = Math.sqrt(dx * dx + dy * dy);
                    initialDisplayCount = displayCount;
                    initialYScale = yScaleMultiplier;
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (e.touches.length === 1 && isDragging) {
                    const currentX = e.touches[0].clientX;
                    const dx = currentX - lastTouchX;
                    const chartW = canvas.width - yAxisWidth;
                    const candleWidth = chartW / displayCount;
                    
                    scrollOffset += dx / candleWidth;
                    const maxOffset = Math.max(0, candlesData.length - displayCount);
                    if (scrollOffset < 0) scrollOffset = 0;
                    if (scrollOffset > maxOffset) scrollOffset = maxOffset;
                    
                    lastTouchX = currentX;
                    drawChart();
                } else if (e.touches.length === 2 && initialPinchDist) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const currentDist = Math.sqrt(dx * dx + dy * dy);
                    const ratio = currentDist / initialPinchDist;

                    if (Math.abs(dx) > Math.abs(dy)) {
                        displayCount = Math.max(20, Math.min(1000, Math.floor(initialDisplayCount / ratio)));
                        const maxOffset = Math.max(0, candlesData.length - displayCount);
                        if (scrollOffset > maxOffset) scrollOffset = maxOffset;
                    } else {
                        yScaleMultiplier = Math.max(0.1, Math.min(10.0, initialYScale / ratio));
                    }
                    drawChart();
                }
            }, { passive: false });

            canvas.addEventListener('touchend', () => { isDragging = false; initialPinchDist = null; });
        }

        // 自動売買ボタンのイベント設定
        function setupAutoTradeEvents() {
            const btnStart = document.getElementById('btnAutoStart');
            const btnStop = document.getElementById('btnAutoStop');

            btnStart.addEventListener('click', () => {
                isAutoTrading = true;
                btnStart.disabled = true;
                btnStop.disabled = false;
                btnStart.innerText = "稼働中...";
                alert("自動売買をスタートしました。");
            });

            btnStop.addEventListener('click', () => {
                isAutoTrading = false;
                btnStart.disabled = false;
                btnStop.disabled = true;
                btnStart.innerText = "▶ スタート";
            });
        }

        async function initApp() {
            await fetchAccount();
            await fetchPosition(); // 初期ポジション取得
            await fetchHistory();
            await fetchHistoricalCandles();
            
            setInterval(fetchPricingAndUpdateChart, 1000);
            setInterval(fetchAccount, 5000);
            setInterval(fetchPosition, 5000); // 5秒ごとにポジション情報を同期
        }

        async function apiRequest(endpoint, method = 'GET', body = null) {
            const options = { method: method, headers: { 'Authorization': `Bearer ${apiToken}`, 'Accept-Datetime-Format': 'UNIX', 'Content-Type': 'application/json' } };
            if (body) options.body = JSON.stringify(body);
            const response = await fetch(`${baseUrl}${endpoint}`, options);
            
            // ポジションが存在しない時の404エラーは正常なので握りつぶす
            if (!response.ok && response.status !== 404) throw new Error(`API Error: ${response.status}`);
            return response.status === 404 ? null : await response.json();
        }

        async function fetchAccount() {
            try {
                const data = await apiRequest(`/accounts/${accountId}/summary`);
                if(!data) return;
                const balance = Math.floor(parseFloat(data.account.balance)).toLocaleString();
                const pl = Math.floor(parseFloat(data.account.unrealizedPL)).toLocaleString();
                document.getElementById('balanceVal').innerText = balance;
                document.getElementById('plVal').innerText = pl;
                document.getElementById('plVal').style.color = parseFloat(data.account.unrealizedPL) >= 0 ? '#4ade80' : '#f87171';
            } catch (e) {}
        }

        // ① 現在のポジションを取得して表示する関数
        async function fetchPosition() {
            try {
                const data = await apiRequest(`/accounts/${accountId}/positions/${instrument}`);
                const posElem = document.getElementById('posVal');
                
                if (!data || !data.position) {
                    currentNetPosition = 0;
                    posElem.innerText = `0 通貨`;
                    posElem.style.color = '#ffffff';
                    return;
                }

                const longQty = parseInt(data.position.long.units) || 0;
                const shortQty = parseInt(data.position.short.units) || 0;
                currentNetPosition = longQty + shortQty; // shortはマイナス値で返ってくる

                if (currentNetPosition > 0) {
                    posElem.innerText = `買 ${currentNetPosition.toLocaleString()} 通貨`;
                    posElem.style.color = '#ef4444';
                } else if (currentNetPosition < 0) {
                    posElem.innerText = `売 ${Math.abs(currentNetPosition).toLocaleString()} 通貨`;
                    posElem.style.color = '#3b82f6';
                } else {
                    posElem.innerText = `0 通貨`;
                    posElem.style.color = '#ffffff';
                }
            } catch (e) { console.error(e); }
        }

        async function fetchHistory() {
            try {
                const data = await apiRequest(`/accounts/${accountId}/transactions?type=ORDER_FILL&count=50`);
                if(!data) return;
                txHistoryData = data.transactions || [];
                
                const list = document.getElementById('historyList');
                list.innerHTML = '';
                if (txHistoryData.length === 0) return;

                txHistoryData.forEach(t => {
                    const time = new Date(parseFloat(t.time) * 1000).toLocaleTimeString();
                    const units = parseInt(t.units);
                    const typeStr = units > 0 ? '買' : '売';
                    const cssClass = units > 0 ? 'hist-buy' : 'hist-sell';
                    list.innerHTML += `
                        <div class="history-item">
                            <span>${time}</span>
                            <span class="${cssClass}">${typeStr} ${Math.abs(units)}通貨</span>
                            <span>@ ${t.price}</span>
                        </div>
                    `;
                });
                drawChart();
            } catch (e) {}
        }

        async function fetchHistoricalCandles() {
            try {
                let allCandles = [];
                const res1 = await apiRequest(`/instruments/${instrument}/candles?granularity=S5&count=5000`);
                if(res1 && res1.candles) allCandles = allCandles.concat(res1.candles);

                if (allCandles.length > 0) {
                    const oldestTime = allCandles[0].time;
                    const res2 = await apiRequest(`/instruments/${instrument}/candles?granularity=S5&count=3640&to=${oldestTime}`);
                    if(res2 && res2.candles) allCandles = res2.candles.concat(allCandles);
                }

                allCandles.sort((a, b) => parseFloat(a.time) - parseFloat(b.time));
                candlesData = allCandles.filter(c => c.complete).map(c => ({
                    time: parseFloat(c.time) * 1000, o: parseFloat(c.mid.o), h: parseFloat(c.mid.h), l: parseFloat(c.mid.l), c: parseFloat(c.mid.c)
                }));
                
                calcIndicators();
                drawChart();
            } catch (e) { console.error(e); }
        }

        async function fetchPricingAndUpdateChart() {
            try {
                const data = await apiRequest(`/accounts/${accountId}/pricing?instruments=${instrument}`);
                if (data && data.prices && data.prices.length > 0) {
                    const priceData = data.prices[0];
                    
                    if (priceData.status !== 'tradeable') {
                        document.getElementById('marketClosedLabel').style.display = 'block';
                        return;
                    } else {
                        document.getElementById('marketClosedLabel').style.display = 'none';
                    }

                    const currentPrice = parseFloat(priceData.bids[0].price);
                    document.getElementById('bidPrice').innerText = priceData.bids[0].price;
                    document.getElementById('askPrice').innerText = priceData.asks[0].price;

                    const now = Date.now();
                    if (candlesData.length > 0) {
                        const lastCandle = candlesData[candlesData.length - 1];
                        if (now - lastCandle.time >= CANDLE_INTERVAL_SEC * 1000) {
                            candlesData.push({ time: now, o: currentPrice, h: currentPrice, l: currentPrice, c: currentPrice });
                            if (candlesData.length > 10000) candlesData.shift();
                        } else {
                            lastCandle.c = currentPrice;
                            if (currentPrice > lastCandle.h) lastCandle.h = currentPrice;
                            if (currentPrice < lastCandle.l) lastCandle.l = currentPrice;
                        }
                    }

                    // ③ 自動売買の判定ロジック呼び出し
                    if (isAutoTrading) evaluateAutoTradeLogic(currentPrice);

                    if (scrollOffset === 0) {
                        calcIndicators();
                        drawChart();
                    }
                }
            } catch (e) {}
        }

        // 自動売買のロジック（※現状は仮の関数。ここにMAクロスなどの条件を記述します）
        async function evaluateAutoTradeLogic(currentPrice) {
            // 例: ポジションがなく、ある条件を満たした場合に注文を出す
            // if (currentNetPosition === 0 && (買い条件)) {
            //     const lot = parseFloat(document.getElementById('autoLot').value);
            //     const units = Math.floor(lot * 100000); // 1.00ロット=10万通貨
            //     executeOrder('BUY', units, true);
            // }
        }

        function calcIndicators() {
            const period = 25;
            for (let i = 0; i < candlesData.length; i++) {
                if (i >= period - 1) {
                    let sum = 0;
                    for (let j = 0; j < period; j++) sum += candlesData[i - j].c;
                    const sma = sum / period;
                    candlesData[i].sma = sma;

                    let varianceSum = 0;
                    for (let j = 0; j < period; j++) { varianceSum += Math.pow(candlesData[i - j].c - sma, 2); }
                    const sd = Math.sqrt(varianceSum / period);
                    candlesData[i].upper = sma + (2 * sd);
                    candlesData[i].lower = sma - (2 * sd);
                }
            }
        }

        function drawChart() {
            if (!ctx || candlesData.length === 0) return;
            const w = canvas.width;
            const h = canvas.height;
            const chartW = w - yAxisWidth; 
            const chartH = h - xAxisHeight;

            ctx.clearRect(0, 0, w, h);

            const startIndex = Math.max(0, candlesData.length - displayCount - Math.floor(scrollOffset));
            const endIndex = Math.min(candlesData.length, startIndex + displayCount);
            const dataToDraw = candlesData.slice(startIndex, endIndex);

            if(dataToDraw.length === 0) return;

            let minP = Infinity, maxP = -Infinity;
            dataToDraw.forEach(c => {
                if (c.h > maxP) maxP = c.h;
                if (c.l < minP) minP = c.l;
                if (c.upper && c.upper > maxP) maxP = c.upper;
                if (c.lower && c.lower < minP) minP = c.lower;
            });

            const midP = (maxP + minP) / 2;
            const baseRange = (maxP - minP) || 0.01;
            const zoomedRange = baseRange * yScaleMultiplier;
            maxP = midP + (zoomedRange / 2) * 1.1; 
            minP = midP - (zoomedRange / 2) * 1.1;
            const finalRange = maxP - minP;

            const candleWidth = chartW / dataToDraw.length;
            const getY = (price) => chartH - ((price - minP) / finalRange) * chartH;

            ctx.lineWidth = 1;
            ['upper', 'lower'].forEach(band => {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
                dataToDraw.forEach((c, i) => {
                    if(c[band]) { const x = i * candleWidth + candleWidth / 2; i === 0 ? ctx.moveTo(x, getY(c[band])) : ctx.lineTo(x, getY(c[band])); }
                });
                ctx.stroke();
            });

            ctx.beginPath();
            ctx.strokeStyle = 'rgba(250, 204, 21, 0.8)';
            dataToDraw.forEach((c, i) => {
                if(c.sma) { const x = i * candleWidth + candleWidth / 2; i === 0 ? ctx.moveTo(x, getY(c.sma)) : ctx.lineTo(x, getY(c.sma)); }
            });
            ctx.stroke();

            dataToDraw.forEach((c, i) => {
                const x = i * candleWidth;
                const yO = getY(c.o); const yC = getY(c.c); const yH = getY(c.h); const yL = getY(c.l);
                const color = c.c >= c.o ? '#ef4444' : '#3b82f6';

                ctx.strokeStyle = color; ctx.fillStyle = color;
                ctx.beginPath(); ctx.moveTo(x + candleWidth / 2, yH); ctx.lineTo(x + candleWidth / 2, yL); ctx.stroke();
                const bodyTop = Math.min(yO, yC);
                let bodyHeight = Math.max(1, Math.abs(yO - yC));
                ctx.fillRect(x + candleWidth * 0.1, bodyTop, candleWidth * 0.8, bodyHeight);
            });

            txHistoryData.forEach(tx => {
                const txTime = parseFloat(tx.time) * 1000;
                const cIndex = dataToDraw.findIndex(c => Math.abs(c.time - txTime) <= CANDLE_INTERVAL_SEC * 1000);
                
                if (cIndex !== -1) {
                    const c = dataToDraw[cIndex];
                    const x = cIndex * candleWidth + candleWidth / 2;
                    const units = parseInt(tx.units);
                    
                    ctx.beginPath();
                    if (units > 0) {
                        ctx.fillStyle = '#ef4444';
                        const y = getY(c.l) + 10;
                        ctx.moveTo(x, y - 5); ctx.lineTo(x - 5, y + 5); ctx.lineTo(x + 5, y + 5);
                    } else {
                        ctx.fillStyle = '#3b82f6';
                        const y = getY(c.h) - 10;
                        ctx.moveTo(x, y + 5); ctx.lineTo(x - 5, y - 5); ctx.lineTo(x + 5, y - 5);
                    }
                    ctx.fill();
                }
            });

            ctx.fillStyle = '#161b26'; ctx.fillRect(0, chartH, chartW, xAxisHeight);
            ctx.fillStyle = '#a0aec0'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
            const step = Math.max(1, Math.floor(60 / candleWidth));
            for (let i = 0; i < dataToDraw.length; i += step) {
                const d = new Date(dataToDraw[i].time);
                ctx.fillText(`${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`, i * candleWidth + candleWidth / 2, h - 4);
            }

            ctx.fillStyle = '#161b26'; ctx.fillRect(chartW, 0, yAxisWidth, h);
            ctx.beginPath(); ctx.strokeStyle = '#2d3748'; ctx.moveTo(chartW, 0); ctx.lineTo(chartW, h); ctx.stroke();
            ctx.fillStyle = '#a0aec0'; ctx.textAlign = 'left';
            for (let i = 1; i <= 5; i++) {
                const yPos = (chartH / 6) * i;
                ctx.fillText((maxP - ((maxP - minP) * (yPos / chartH))).toFixed(3), chartW + 5, yPos + 4);
            }
        }

        // 成行注文実行 (手動用と自動用の兼任)
        async function executeOrder(direction, forceUnits = null, isAuto = false) {
            let units;
            if (forceUnits) {
                units = forceUnits; // 自動売買時
            } else {
                units = parseInt(document.getElementById('lotSize').value); // 手動時
                if (!confirm(`USD/JPY を ${units}通貨 ${direction === 'BUY' ? '買' : '売'} しますか？`)) return;
            }

            const orderUnits = direction === 'SELL' ? (units * -1).toString() : units.toString();
            const body = { order: { units: orderUnits, instrument: instrument, timeInForce: "FOK", type: "MARKET", positionFill: "DEFAULT" } };

            try {
                const result = await apiRequest(`/accounts/${accountId}/orders`, 'POST', body);
                if (result && result.orderFillTransaction) {
                    if(!isAuto) alert(`約定: @ ${result.orderFillTransaction.price}`);
                    fetchAccount(); fetchPosition(); fetchHistory();
                } else {
                    if(!isAuto) alert("注文拒否。");
                }
            } catch (e) {
                if(!isAuto) alert("注文エラー (CORS制限の可能性)");
            }
        }

        // ② 全決済の実行
        async function executeCloseAll() {
            if (currentNetPosition === 0) {
                alert("決済するポジションがありません。");
                return;
            }
            if (!confirm(`現在のポジション (${currentNetPosition > 0 ? '買' : '売'} ${Math.abs(currentNetPosition)}通貨) をすべて成行決済しますか？`)) return;

            const body = {};
            if (currentNetPosition > 0) body.longUnits = "ALL";
            else body.shortUnits = "ALL";

            try {
                const result = await apiRequest(`/accounts/${accountId}/positions/${instrument}/close`, 'PUT', body);
                if (result && (result.longOrderFillTransaction || result.shortOrderFillTransaction)) {
                    alert("全決済が完了しました。");
                    fetchAccount(); fetchPosition(); fetchHistory();
                } else {
                    alert("決済が拒否されました。");
                }
            } catch (e) {
                alert("決済エラー (CORS制限の可能性)");
            }
        }

        document.getElementById('btnSell').addEventListener('click', () => executeOrder('SELL'));
        document.getElementById('btnBuy').addEventListener('click', () => executeOrder('BUY'));
        document.getElementById('btnCloseAll').addEventListener('click', executeCloseAll);

    </script>
</body>
</html>
