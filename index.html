<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>当五郎</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; }
        .header { background: #01579b; color: white; padding: 20px; text-align: center; position: relative; }
        .container { padding: 10px; max-width: 600px; margin: auto; }
        .box { background: white; padding: 20px; border-radius: 15px; margin: 10px; text-align: center; }
        .btn { background: #ffc107; border: none; padding: 15px; border-radius: 30px; font-weight: bold; width: 90%; cursor: pointer; }
    </style>
</head>
<body>
<div class="header">
    <span style="position:absolute;top:5px;right:10px;font-size:0.6rem;opacity:0.7;">Ver 1.1.0</span>
    <h1>当五郎</h1>
</div>
<div class="container">
    <div class="box">
        <input type="date" id="d" style="padding:10px;width:80%;margin-bottom:10px;">
        <button class="btn" onclick="go()">予想を開始する</button>
    </div>
    <div id="s" style="text-align:center;font-weight:bold;margin:10px;"></div>
    <div id="o"></div>
</div>
<script>
    // 工藤さんの最新URLをセット
    const url = "https://script.google.com/macros/s/AKfycbxeUalWMFs0hsIU5HnArPV4m1jb5w6crqGkaoe08s4NinsK-cJ_KEo-Ha4nYJrOPUmLRQ/exec";
    
    window.onload = () => { document.getElementById('d').value = new Date().toISOString().split('T')[0]; };

    function go() {
        document.getElementById('s').innerText = "🚀 サーバーに接続中...";
        document.getElementById('o').innerHTML = "";
        
        const old = document.getElementById('j-script');
        if (old) old.remove();

        const s = document.createElement('script');
        s.id = 'j-script';
        s.src = url + "?ymd=" + document.getElementById('d').value.replace(/-/g,'') + "&t=" + new Date().getTime();
        document.body.appendChild(s);
    }

    window.renderData = (res) => {
        document.getElementById('s').innerText = "";
        document.getElementById('o').innerHTML = res.html || "⚠️データなし";
    };
</script>
</body>
</html>
