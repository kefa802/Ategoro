<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12球団応援歌＆名鑑</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white pb-20">

    <header class="p-4 bg-black text-center sticky top-0 z-50">
        <h1 class="text-xl font-bold italic text-orange-500">PLAYER ENCYCLOPEDIA</h1>
    </header>

    <main class="p-4 max-w-md mx-auto">
        <div id="player-list" class="grid gap-3">
            <button onclick="openPlayer('坂本勇人')" class="p-5 rounded-xl bg-gray-800 border-l-8 border-orange-500 text-left font-black text-xl hover:bg-gray-700 transition-all">
                坂本 勇人
            </button>
            <button onclick="openPlayer('柳田悠岐')" class="p-5 rounded-xl bg-gray-800 border-l-8 border-yellow-400 text-left font-black text-xl hover:bg-gray-700 transition-all">
                柳田 悠岐
            </button>
        </div>
    </main>

    <div id="modal" class="fixed inset-0 bg-black/95 z-[100] hidden flex flex-col p-4 overflow-y-auto">
        <button onclick="closeModal()" class="self-end text-3xl p-2">&times;</button>
        
        <div class="mt-2">
            <h2 id="m-name" class="text-3xl font-black italic mb-4 border-b-2 border-white pb-2 text-center"></h2>
            
            <div class="mb-6">
                <h3 class="text-xs font-bold text-gray-400 mb-2 uppercase tracking-tighter">Wikipedia Summary</h3>
                <div id="m-wiki" class="bg-white/10 p-4 rounded-xl text-sm leading-relaxed text-gray-200">
                    読み込み中...
                </div>
            </div>

            <div class="mb-6">
                <h3 class="text-xs font-bold text-gray-400 mb-2 uppercase tracking-tighter">Cheer Song</h3>
                <div class="bg-orange-600/20 p-4 rounded-xl border border-orange-500/50">
                    <p id="m-lyrics" class="font-bold text-lg whitespace-pre-wrap text-center">応援歌データ準備中...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function openPlayer(playerName) {
            document.getElementById('m-name').innerText = playerName;
            document.getElementById('m-wiki').innerText = "Wikipediaから取得中...";
            document.getElementById('modal').classList.remove('hidden');

            try {
                // Wikipedia API を叩く (CORS対応のエンドポイント)
                const url = `https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(playerName)}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.extract) {
                    document.getElementById('m-wiki').innerText = data.extract;
                } else {
                    document.getElementById('m-wiki').innerText = "情報が見つかりませんでした。";
                }
            } catch (error) {
                document.getElementById('m-wiki').innerText = "Wikipediaの読み込みに失敗しました。";
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }
    </script>
</body>
</html>
