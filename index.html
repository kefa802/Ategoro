<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OANDA Pro Trading</title>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background-color: #0b101e; color: #ffffff; overflow: hidden; }
        .container { display: flex; flex-direction: column; height: 100vh; }
        
        /* === ログイン画面のスタイル === */
        #loginArea { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background-color: #0b101e; padding: 20px; }
        .login-box { background-color: #161b26; padding: 20px; border-radius: 8px; border: 1px solid #2d3748; width: 100%; max-width: 400px; box-sizing: border-box; }
        .login-box h2 { text-align: center; margin-top: 0; color: #cbd5e1; font-size: 18px; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 13px; color: #a0aec0; }
        .input-group input[type="text"], .input-group input[type="password"] { width: 100%; padding: 12px; background: #2d3748; border: 1px solid #4a5568; color: white; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .checkbox-group { display: flex; align-items: center; margin-top: 8px; font-size: 13px; color: #94a3b8; }
        .checkbox-group input { margin-right: 6px; width: 16px; height: 16px; }
        .btn-login { width: 100%; padding: 14px; background: linear-gradient(180deg, #10b981 0%, #059669 100%); color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-login:active { opacity: 0.8; transform: translateY(2px); }

        /* === メインUIのスタイル === */
        .header { display: flex; justify-content: space-between; padding: 6px 10px; background-color: #161b26; border-bottom: 1px solid #2d3748; font-size: 13px; }
        .header span { font-weight: bold; color: #a0aec0; }
        .header .val { color: #ffffff; font-size: 14px; }

        #chartWrapper { height: 28vh; min-height: 160px; width: 100%; border-bottom: 1px solid #2d3748; position: relative; background: #0b101e; }
        #instrumentSelector { position: absolute; top: 5px; left: 5px; z-index: 10; background: #1a202c; color: white; border: 1px solid #4a5568; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; outline: none; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        #marketClosedLabel { position: absolute; top: 5px; right: 5px; background: rgba(220, 38, 38, 0.8); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; display: none; }

        .pos-dashboard { display: flex; background-color: #161b26; border-bottom: 1px solid #2d3748; }
        .pos-side { flex: 1; padding: 6px 10px; display: flex; flex-direction: column; }
        .pos-sell { border-right: 1px solid #2d3748; background: linear-gradient(to bottom, rgba(59, 130, 246, 0.05), transparent); }
        .pos-buy { background: linear-gradient(to bottom, rgba(239, 68, 68, 0.05), transparent); }
        
        .pos-header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #2d3748; padding-bottom: 4px; margin-bottom: 4px; }
        .pos-title { font-size: 14px; font-weight: bold; }
        
        .btn-close-small { padding: 4px 12px; font-size: 11px; border: none; border-radius: 4px; font-weight: bold; color: white; cursor: pointer; }
        .btn-close-small:active { opacity: 0.8; }
        .btn-close-sell { background-color: #3b82f6; }
        .btn-close-buy { background-color: #ef4444; }
        .btn-close-small:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }

        .pos-stats { font-size: 12px; }
        .pos-stats-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .pos-stats-row .label { color: #a0aec0; }
        .pos-stats-row .val { font-weight: bold; }

        .order-panel { padding: 6px 10px; background-color: #161b26; border-bottom: 1px solid #2d3748; }
        .lot-selector { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
        .lot-selector select { background: #2d3748; color: white; border: 1px solid #4a5568; padding: 4px 8px; border-radius: 4px; }
        
        .trade-buttons { display: flex; justify-content: space-between; gap: 10px; }
        .btn-trade { flex: 1; padding: 6px; border: none; border-radius: 6px; font-weight: bold; color: white; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .btn-sell-big { background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%); }
        .btn-buy-big { background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%); }
        .btn-trade:active { opacity: 0.8; transform: translateY(2px); }
        .btn-label { font-size: 11px; margin-bottom: 0px; opacity: 0.9; }
        .btn-price { font-size: 20px; letter-spacing: 1px; }

        .auto-panel { padding: 6px 10px; background-color: #1e293b; border-bottom: 1px solid #2d3748; }
        .auto-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
        .auto-controls { display: flex; gap: 10px; }
        .btn-auto { flex: 1; padding: 6px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; font-size: 13px;}
        .btn-auto.start { background: #10b981; }
        .btn-auto.stop { background: #ef4444; }
        .btn-auto:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; opacity: 0.5; }
        
        .history-panel { flex: 1; padding: 5px 10px; background-color: #0b101e; font-size: 11px; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1a202c; }
        .hist-sell { color: #60a5fa; font-weight: bold; }
        .hist-buy { color: #f87171; font-weight: bold; }
        
        .hidden { display: none !important; }
        .text-green { color: #4ade80 !important; }
        .text-red { color: #f87171 !important; }
        .text-gray { color: #a0aec0 !important; }
    </style>
</head>
<body>

    <div id="loginArea">
        <div class="login-box">
            <h2>OANDA ログイン設定</h2>
            
            <div class="input-group">
                <label>口座ID (Account ID)</label>
                <input type="text" id="accountIdInput" placeholder="例: 001-009-11732183-002">
                <label class="checkbox-group">
                    <input type="checkbox" id="saveIdCheck"> 口座IDを保存する
                </label>
            </div>

            <div class="input-group">
                <label>APIトークン</label>
                <input type="password" id="apiTokenInput" placeholder="APIトークンを入力">
                <label class="checkbox-group">
                    <input type="checkbox" id="saveTokenCheck"> APIトークンを保存する
                </label>
            </div>

            <button id="loginBtn" class="btn-login">ログインして開始</button>
        </div>
    </div>

    <div id="mainUI" class="container hidden">
        <div class="header">
            <div><span>総残高:</span> <span id="balanceVal">--</span><span> 円</span></div>
            <div><span>総含み損益:</span> <span id="plVal">--</span><span> 円</span></div>
        </div>

        <div id="chartWrapper">
            <select id="instrumentSelector">
                <option value="USD_JPY" selected>USD/JPY</option>
                <option value="EUR_JPY">EUR/JPY</option>
                <option value="GBP_JPY">GBP/JPY</option>
                <option value="AUD_JPY">AUD/JPY</option>
                <option value="EUR_USD">EUR/USD</option>
                <option value="GBP_USD">GBP/USD</option>
            </select>
            <div id="marketClosedLabel">休場中</div>
            <canvas id="myCanvas"></canvas>
        </div>

        <div class="pos-dashboard">
            <div class="pos-side pos-sell">
                <div class="pos-header-bar">
                    <span class="pos-title" style="color: #60a5fa;">売 (BID)</span>
                    <button id="btnSideCloseShort" class="btn-close-small btn-close-sell" disabled>全決済</button>
                </div>
                <div class="pos-stats">
                    <div class="pos-stats-row"><span class="label">数量</span> <span id="shortUnits" class="val">0</span></div>
                    <div class="pos-stats-row"><span class="label">平均建値</span> <span id="shortAvg" class="val">---.---</span></div>
                    <div class="pos-stats-row"><span class="label">損益(円)</span> <span id="shortPL" class="val">0</span></div>
                    <div class="pos-stats-row"><span class="label">Pips</span> <span id="shortPips" class="val text-gray">0.0</span></div>
                </div>
            </div>

            <div class="pos-side pos-buy">
                <div class="pos-header-bar">
                    <span class="pos-title" style="color: #f87171;">買 (ASK)</span>
                    <button id="btnSideCloseLong" class="btn-close-small btn-close-buy" disabled>全決済</button>
                </div>
                <div class="pos-stats">
                    <div class="pos-stats-row"><span class="label">数量</span> <span id="longUnits" class="val">0</span></div>
                    <div class="pos-stats-row"><span class="label">平均建値</span> <span id="longAvg" class="val">---.---</span></div>
                    <div class="pos-stats-row"><span class="label">損益(円)</span> <span id="longPL" class="val">0</span></div>
                    <div class="pos-stats-row"><span class="label">Pips</span> <span id="longPips" class="val text-gray">0.0</span></div>
                </div>
            </div>
        </div>

        <div class="order-panel">
            <div class="lot-selector">
                <span>手動数量:</span>
                <select id="lotSize">
                    <option value="1">1通貨</option>
                    <option value="1000">1,000通貨</option>
                    <option value="10000">10,000通貨</option>
                </select>
            </div>
            <div class="trade-buttons">
                <button id="btnSell" class="btn-trade btn-sell-big">
                    <span class="btn-label">売 | BID</span>
                    <span id="bidPrice" class="btn-price">---.---</span>
                </button>
                <button id="btnBuy" class="btn-trade btn-buy-big">
                    <span class="btn-label">買 | ASK</span>
                    <span id="askPrice" class="btn-price">---.---</span>
                </button>
            </div>
        </div>

        <div class="auto-panel">
            <div class="auto-header">
                <span style="font-weight:bold; color:#cbd5e1;">🤖 自動売買</span>
                <div>
                    ロット: <input type="number" id="autoLot" min="0.01" max="1.00" step="0.01" value="0.01" style="width: 50px; text-align: center; padding: 2px;"> 
                    <span style="color: #a0aec0; font-size: 10px;">(1.00=10万)</span>
                </div>
            </div>
            <div class="auto-controls">
                <button id="btnAutoStart" class="btn-auto start">▶ スタート</button>
                <button id="btnAutoStop" class="btn-auto stop" disabled>■ ストップ</button>
            </div>
        </div>

        <div class="history-panel">
            <div style="color: #a0aec0; margin-bottom: 5px; position: sticky; top: 0; background: #0b101e; padding-bottom: 2px;">直近の取引履歴</div>
            <div id="historyList">履歴はありません</div>
        </div>
    </div>

    <script>
        const baseUrl = "https://api-fxtrade.oanda.com/v3";
        let accountId = "";
        let apiToken = "";
        let instrument = "USD_JPY";
        
        let candlesData = [];
        let txHistoryData = [];
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const CANDLE_INTERVAL_SEC = 5; 
        
        let displayCount = 200;
        let yScaleMultiplier = 1.0; 
        let scrollOffset = 0;
        const yAxisWidth = 55;
        const xAxisHeight = 20;
        
        let initialPinchDist = null;
        let initialDisplayCount = 200;
        let initialYScale = 1.0;
        let isDragging = false;
        let lastTouchX = 0;

        let currentLongUnits = 0;
        let currentLongAvg = 0;
        let currentShortUnits = 0;
        let currentShortAvg = 0;
        let isAutoTrading = false;

        let priceInterval, accountInterval, posInterval;

        // アプリ起動時の処理（保存データの読み込み）
        window.onload = () => {
            const savedId = localStorage.getItem('oanda_account_id');
            const savedToken = localStorage.getItem('oanda_api_token');
            
            if (savedId) {
                document.getElementById('accountIdInput').value = savedId;
                document.getElementById('saveIdCheck').checked = true;
            }
            if (savedToken) {
                document.getElementById('apiTokenInput').value = savedToken;
                document.getElementById('saveTokenCheck').checked = true;
            }
        };

        // ログインボタンの処理
        document.getElementById('loginBtn').addEventListener('click', () => {
            const idInput = document.getElementById('accountIdInput').value.trim();
            const tokenInput = document.getElementById('apiTokenInput').value.trim();
            
            if (!idInput || !tokenInput) {
                alert("口座IDとAPIトークンを入力してください。");
                return;
            }
            
            // チェックボックスの状態に応じて保存・削除
            if (document.getElementById('saveIdCheck').checked) {
                localStorage.setItem('oanda_account_id', idInput);
            } else {
                localStorage.removeItem('oanda_account_id');
            }
            
            if (document.getElementById('saveTokenCheck').checked) {
                localStorage.setItem('oanda_api_token', tokenInput);
            } else {
                localStorage.removeItem('oanda_api_token');
            }
            
            accountId = idInput;
            apiToken = tokenInput;
            
            // 画面の切り替え
            document.getElementById('loginArea').classList.add('hidden');
            document.getElementById('mainUI').classList.remove('hidden');
            
            // UIの初期化
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            setupTouchEvents();
            setupAutoTradeEvents();
            
            // 通貨ペア変更イベント
            document.getElementById('instrumentSelector').addEventListener('change', (e) => {
                instrument = e.target.value;
                resetDataAndReload();
            });

            initApp();
        });

        function resetDataAndReload() {
            candlesData = [];
            txHistoryData = [];
            scrollOffset = 0;
            document.getElementById('historyList').innerHTML = '読込中...';
            document.getElementById('bidPrice').innerText = '---.---';
            document.getElementById('askPrice').innerText = '---.---';
            initApp();
        }

        function startIntervals() {
            if(priceInterval) clearInterval(priceInterval);
            if(accountInterval) clearInterval(accountInterval);
            if(posInterval) clearInterval(posInterval);
            
            priceInterval = setInterval(fetchPricingAndUpdateChart, 1000);
            accountInterval = setInterval(fetchAccount, 5000);
            posInterval = setInterval(fetchPosition, 3000);
        }

        async function initApp() {
            await fetchAccount();
            await fetchPosition();
            await fetchHistory();
            await fetchHistoricalCandles();
            startIntervals();
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            drawChart();
        }

        function setupTouchEvents() {
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true; lastTouchX = e.touches[0].clientX;
                } else if (e.touches.length === 2) {
                    isDragging = false;
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    initialPinchDist = Math.sqrt(dx * dx + dy * dy);
                    initialDisplayCount = displayCount; initialYScale = yScaleMultiplier;
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (e.touches.length === 1 && isDragging) {
                    const dx = e.touches[0].clientX - lastTouchX;
                    const candleWidth = (canvas.width - yAxisWidth) / displayCount;
                    scrollOffset += dx / candleWidth;
                    const maxOffset = Math.max(0, candlesData.length - displayCount);
                    if (scrollOffset < 0) scrollOffset = 0;
                    if (scrollOffset > maxOffset) scrollOffset = maxOffset;
                    lastTouchX = e.touches[0].clientX;
                    drawChart();
                } else if (e.touches.length === 2 && initialPinchDist) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const ratio = Math.sqrt(dx * dx + dy * dy) / initialPinchDist;
                    if (Math.abs(dx) > Math.abs(dy)) {
                        displayCount = Math.max(20, Math.min(1000, Math.floor(initialDisplayCount / ratio)));
                        const maxOffset = Math.max(0, candlesData.length - displayCount);
                        if (scrollOffset > maxOffset) scrollOffset = maxOffset;
                    } else {
                        yScaleMultiplier = Math.max(0.1, Math.min(10.0, initialYScale / ratio));
                    }
                    drawChart();
                }
            }, { passive: false });

            canvas.addEventListener('touchend', () => { isDragging = false; initialPinchDist = null; });
        }

        function setupAutoTradeEvents() {
            const btnStart = document.getElementById('btnAutoStart');
            const btnStop = document.getElementById('btnAutoStop');

            btnStart.addEventListener('click', () => {
                isAutoTrading = true;
                btnStart.disabled = true; btnStop.disabled = false;
                btnStart.innerText = "稼働中...";
                alert("自動売買をスタートしました。");
            });

            btnStop.addEventListener('click', () => {
                isAutoTrading = false;
                btnStart.disabled = false; btnStop.disabled = true;
                btnStart.innerText = "▶ スタート";
            });
        }

        async function apiRequest(endpoint, method = 'GET', body = null) {
            const options = { method: method, headers: { 'Authorization': `Bearer ${apiToken}`, 'Accept-Datetime-Format': 'UNIX', 'Content-Type': 'application/json' } };
            if (body) options.body = JSON.stringify(body);
            const response = await fetch(`${baseUrl}${endpoint}`, options);
            if (!response.ok && response.status !== 404) throw new Error(`API Error: ${response.status}`);
            return response.status === 404 ? null : await response.json();
        }

        async function fetchAccount() {
            try {
                const data = await apiRequest(`/accounts/${accountId}/summary`);
                if(!data) return;
                const balance = Math.floor(parseFloat(data.account.balance)).toLocaleString();
                const pl = Math.floor(parseFloat(data.account.unrealizedPL));
                document.getElementById('balanceVal').innerText = balance;
                document.getElementById('plVal').innerText = pl.toLocaleString();
                document.getElementById('plVal').className = pl >= 0 ? 'val text-green' : 'val text-red';
            } catch (e) {}
        }

        async function fetchPosition() {
            try {
                const data = await apiRequest(`/accounts/${accountId}/positions/${instrument}`);
                
                currentLongUnits = 0; currentLongAvg = 0;
                currentShortUnits = 0; currentShortAvg = 0;
                let longPL = 0, shortPL = 0;

                if (data && data.position) {
                    currentLongUnits = parseInt(data.position.long.units) || 0;
                    currentLongAvg = parseFloat(data.position.long.averagePrice) || 0;
                    longPL = parseFloat(data.position.long.unrealizedPL) || 0;

                    currentShortUnits = Math.abs(parseInt(data.position.short.units) || 0);
                    currentShortAvg = parseFloat(data.position.short.averagePrice) || 0;
                    shortPL = parseFloat(data.position.short.unrealizedPL) || 0;
                }

                document.getElementById('longUnits').innerText = currentLongUnits.toLocaleString();
                document.getElementById('longAvg').innerText = currentLongUnits > 0 ? currentLongAvg.toFixed(3) : "---.---";
                document.getElementById('longPL').innerText = Math.floor(longPL).toLocaleString();
                document.getElementById('longPL').className = longPL >= 0 ? 'val text-green' : 'val text-red';
                document.getElementById('btnSideCloseLong').disabled = (currentLongUnits === 0);

                document.getElementById('shortUnits').innerText = currentShortUnits.toLocaleString();
                document.getElementById('shortAvg').innerText = currentShortUnits > 0 ? currentShortAvg.toFixed(3) : "---.---";
                document.getElementById('shortPL').innerText = Math.floor(shortPL).toLocaleString();
                document.getElementById('shortPL').className = shortPL >= 0 ? 'val text-green' : 'val text-red';
                document.getElementById('btnSideCloseShort').disabled = (currentShortUnits === 0);

            } catch (e) {}
        }

        async function fetchHistory() {
            try {
                const data = await apiRequest(`/accounts/${accountId}/transactions?type=ORDER_FILL&count=50`);
                if(!data) return;
                txHistoryData = data.transactions || [];
                
                const list = document.getElementById('historyList');
                list.innerHTML = '';
                if (txHistoryData.length === 0) return;

                txHistoryData.forEach(t => {
                    const time = new Date(parseFloat(t.time) * 1000).toLocaleTimeString();
                    const units = parseInt(t.units);
                    const typeStr = units > 0 ? '買' : '売';
                    const cssClass = units > 0 ? 'hist-buy' : 'hist-sell';
                    if(t.instrument === instrument) {
                        list.innerHTML += `<div class="history-item"><span>${time}</span><span class="${cssClass}">${typeStr} ${Math.abs(units)}</span><span>@ ${t.price}</span></div>`;
                    }
                });
                drawChart();
            } catch (e) {}
        }

        async function fetchHistoricalCandles() {
            try {
                let allCandles = [];
                const res1 = await apiRequest(`/instruments/${instrument}/candles?granularity=S5&count=5000`);
                if(res1 && res1.candles) allCandles = allCandles.concat(res1.candles);

                if (allCandles.length > 0) {
                    const oldestTime = allCandles[0].time;
                    const res2 = await apiRequest(`/instruments/${instrument}/candles?granularity=S5&count=3640&to=${oldestTime}`);
                    if(res2 && res2.candles) allCandles = res2.candles.concat(allCandles);
                }

                allCandles.sort((a, b) => parseFloat(a.time) - parseFloat(b.time));
                candlesData = allCandles.filter(c => c.complete).map(c => ({
                    time: parseFloat(c.time) * 1000, o: parseFloat(c.mid.o), h: parseFloat(c.mid.h), l: parseFloat(c.mid.l), c: parseFloat(c.mid.c)
                }));
                
                calcIndicators();
                drawChart();
            } catch (e) {}
        }

        async function fetchPricingAndUpdateChart() {
            try {
                const data = await apiRequest(`/accounts/${accountId}/pricing?instruments=${instrument}`);
                if (data && data.prices && data.prices.length > 0) {
                    const priceData = data.prices[0];
                    
                    if (priceData.status !== 'tradeable') {
                        document.getElementById('marketClosedLabel').style.display = 'block';
                        return;
                    } else {
                        document.getElementById('marketClosedLabel').style.display = 'none';
                    }

                    const bidPrice = parseFloat(priceData.bids[0].price);
                    const askPrice = parseFloat(priceData.asks[0].price);
                    document.getElementById('bidPrice').innerText = priceData.bids[0].price;
                    document.getElementById('askPrice').innerText = priceData.asks[0].price;

                    // Pip計算 (JPYペアとそれ以外で桁数を自動判定)
                    const isJPY = instrument.includes('JPY');
                    const pipMultiplier = isJPY ? 100 : 10000;

                    if (currentShortUnits > 0 && currentShortAvg > 0) {
                        const pips = (currentShortAvg - askPrice) * pipMultiplier;
                        const pElem = document.getElementById('shortPips');
                        pElem.innerText = `${pips.toFixed(1)}`;
                        pElem.className = pips >= 0 ? 'val text-green' : 'val text-red';
                    } else {
                        document.getElementById('shortPips').innerText = `0.0`;
                        document.getElementById('shortPips').className = 'val text-gray';
                    }

                    if (currentLongUnits > 0 && currentLongAvg > 0) {
                        const pips = (bidPrice - currentLongAvg) * pipMultiplier;
                        const pElem = document.getElementById('longPips');
                        pElem.innerText = `${pips.toFixed(1)}`;
                        pElem.className = pips >= 0 ? 'val text-green' : 'val text-red';
                    } else {
                        document.getElementById('longPips').innerText = `0.0`;
                        document.getElementById('longPips').className = 'val text-gray';
                    }

                    const currentMid = (bidPrice + askPrice) / 2;
                    const now = Date.now();
                    if (candlesData.length > 0) {
                        const lastCandle = candlesData[candlesData.length - 1];
                        if (now - lastCandle.time >= CANDLE_INTERVAL_SEC * 1000) {
                            candlesData.push({ time: now, o: currentMid, h: currentMid, l: currentMid, c: currentMid });
                            if (candlesData.length > 10000) candlesData.shift();
                        } else {
                            lastCandle.c = currentMid;
                            if (currentMid > lastCandle.h) lastCandle.h = currentMid;
                            if (currentMid < lastCandle.l) lastCandle.l = currentMid;
                        }
                    }

                    if (isAutoTrading) evaluateAutoTradeLogic(currentMid);

                    if (scrollOffset === 0) {
                        calcIndicators();
                        drawChart();
                    }
                }
            } catch (e) {}
        }

        async function evaluateAutoTradeLogic(currentPrice) {
            // 自動売買ロジック
        }

        function calcIndicators() {
            const period = 25;
            for (let i = 0; i < candlesData.length; i++) {
                if (i >= period - 1) {
                    let sum = 0;
                    for (let j = 0; j < period; j++) sum += candlesData[i - j].c;
                    const sma = sum / period;
                    candlesData[i].sma = sma;

                    let varianceSum = 0;
                    for (let j = 0; j < period; j++) { varianceSum += Math.pow(candlesData[i - j].c - sma, 2); }
                    const sd = Math.sqrt(varianceSum / period);
                    candlesData[i].upper = sma + (2 * sd);
                    candlesData[i].lower = sma - (2 * sd);
                }
            }
        }

        function drawChart() {
            if (!ctx || candlesData.length === 0) return;
            const w = canvas.width; const h = canvas.height;
            const chartW = w - yAxisWidth; const chartH = h - xAxisHeight;

            ctx.clearRect(0, 0, w, h);

            const startIndex = Math.max(0, candlesData.length - displayCount - Math.floor(scrollOffset));
            const endIndex = Math.min(candlesData.length, startIndex + displayCount);
            const dataToDraw = candlesData.slice(startIndex, endIndex);

            if(dataToDraw.length === 0) return;

            let minP = Infinity, maxP = -Infinity;
            dataToDraw.forEach(c => {
                if (c.h > maxP) maxP = c.h; if (c.l < minP) minP = c.l;
                if (c.upper && c.upper > maxP) maxP = c.upper; if (c.lower && c.lower < minP) minP = c.lower;
            });

            const midP = (maxP + minP) / 2;
            const baseRange = (maxP - minP) || 0.001;
            const zoomedRange = baseRange * yScaleMultiplier;
            maxP = midP + (zoomedRange / 2) * 1.1; minP = midP - (zoomedRange / 2) * 1.1;
            const finalRange = maxP - minP;

            const candleWidth = chartW / dataToDraw.length;
            const getY = (price) => chartH - ((price - minP) / finalRange) * chartH;

            ctx.lineWidth = 1;
            ['upper', 'lower'].forEach(band => {
                ctx.beginPath(); ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
                dataToDraw.forEach((c, i) => {
                    if(c[band]) { const x = i * candleWidth + candleWidth / 2; i === 0 ? ctx.moveTo(x, getY(c[band])) : ctx.lineTo(x, getY(c[band])); }
                });
                ctx.stroke();
            });

            ctx.beginPath(); ctx.strokeStyle = 'rgba(250, 204, 21, 0.8)';
            dataToDraw.forEach((c, i) => {
                if(c.sma) { const x = i * candleWidth + candleWidth / 2; i === 0 ? ctx.moveTo(x, getY(c.sma)) : ctx.lineTo(x, getY(c.sma)); }
            });
            ctx.stroke();

            dataToDraw.forEach((c, i) => {
                const x = i * candleWidth;
                const yO = getY(c.o); const yC = getY(c.c); const yH = getY(c.h); const yL = getY(c.l);
                const color = c.c >= c.o ? '#ef4444' : '#3b82f6';
                ctx.strokeStyle = color; ctx.fillStyle = color;
                ctx.beginPath(); ctx.moveTo(x + candleWidth / 2, yH); ctx.lineTo(x + candleWidth / 2, yL); ctx.stroke();
                const bodyTop = Math.min(yO, yC);
                let bodyHeight = Math.max(1, Math.abs(yO - yC));
                ctx.fillRect(x + candleWidth * 0.1, bodyTop, candleWidth * 0.8, bodyHeight);
            });

            txHistoryData.forEach(tx => {
                if (tx.instrument !== instrument) return;
                const txTime = parseFloat(tx.time) * 1000;
                const cIndex = dataToDraw.findIndex(c => Math.abs(c.time - txTime) <= CANDLE_INTERVAL_SEC * 1000);
                if (cIndex !== -1) {
                    const c = dataToDraw[cIndex]; const x = cIndex * candleWidth + candleWidth / 2; const units = parseInt(tx.units);
                    ctx.beginPath();
                    if (units > 0) {
                        ctx.fillStyle = '#ef4444'; const y = getY(c.l) + 10;
                        ctx.moveTo(x, y - 5); ctx.lineTo(x - 5, y + 5); ctx.lineTo(x + 5, y + 5);
                    } else {
                        ctx.fillStyle = '#3b82f6'; const y = getY(c.h) - 10;
                        ctx.moveTo(x, y + 5); ctx.lineTo(x - 5, y - 5); ctx.lineTo(x + 5, y - 5);
                    }
                    ctx.fill();
                }
            });

            ctx.fillStyle = '#161b26'; ctx.fillRect(0, chartH, chartW, xAxisHeight);
            ctx.fillStyle = '#a0aec0'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
            const step = Math.max(1, Math.floor(60 / candleWidth));
            for (let i = 0; i < dataToDraw.length; i += step) {
                const d = new Date(dataToDraw[i].time);
                ctx.fillText(`${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`, i * candleWidth + candleWidth / 2, h - 4);
            }

            ctx.fillStyle = '#161b26'; ctx.fillRect(chartW, 0, yAxisWidth, h);
            ctx.beginPath(); ctx.strokeStyle = '#2d3748'; ctx.moveTo(chartW, 0); ctx.lineTo(chartW, h); ctx.stroke();
            ctx.fillStyle = '#a0aec0'; ctx.textAlign = 'left';
            const isJPY = instrument.includes('JPY');
            for (let i = 1; i <= 5; i++) {
                const yPos = (chartH / 6) * i;
                const price = maxP - ((maxP - minP) * (yPos / chartH));
                ctx.fillText(isJPY ? price.toFixed(3) : price.toFixed(5), chartW + 5, yPos + 4);
            }
        }

        async function executeOrder(direction, forceUnits = null, isAuto = false) {
            let units = forceUnits || parseInt(document.getElementById('lotSize').value);
            if (!isAuto && !confirm(`${instrument.replace('_', '/')} を ${units}通貨 ${direction === 'BUY' ? '買' : '売'} しますか？`)) return;

            const orderUnits = direction === 'SELL' ? (units * -1).toString() : units.toString();
            const body = { order: { units: orderUnits, instrument: instrument, timeInForce: "FOK", type: "MARKET", positionFill: "DEFAULT" } };

            try {
                const result = await apiRequest(`/accounts/${accountId}/orders`, 'POST', body);
                if (result && result.orderFillTransaction) {
                    if(!isAuto) alert(`約定: @ ${result.orderFillTransaction.price}`);
                    fetchAccount(); fetchPosition(); fetchHistory();
                } else {
                    if(!isAuto) alert("注文拒否。");
                }
            } catch (e) { if(!isAuto) alert("注文エラー"); }
        }

        async function executeSideClose(side) {
            const body = {};
            if (side === 'LONG') {
                if (currentLongUnits === 0) return;
                if (!confirm(`買ポジション (${currentLongUnits}通貨) をすべて成行決済しますか？`)) return;
                body.longUnits = "ALL";
            } else if (side === 'SHORT') {
                if (currentShortUnits === 0) return;
                if (!confirm(`売ポジション (${currentShortUnits}通貨) をすべて成行決済しますか？`)) return;
                body.shortUnits = "ALL";
            }

            try {
                const result = await apiRequest(`/accounts/${accountId}/positions/${instrument}/close`, 'PUT', body);
                if (result && (result.longOrderFillTransaction || result.shortOrderFillTransaction)) {
                    alert("決済が完了しました。");
                    fetchAccount(); fetchPosition(); fetchHistory();
                } else {
                    alert("決済が拒否されました。");
                }
            } catch (e) { alert("決済エラー"); }
        }

        // イベントリスナーの登録
        document.getElementById('btnSell').addEventListener('click', () => executeOrder('SELL'));
        document.getElementById('btnBuy').addEventListener('click', () => executeOrder('BUY'));
        document.getElementById('btnSideCloseLong').addEventListener('click', () => executeSideClose('LONG'));
        document.getElementById('btnSideCloseShort').addEventListener('click', () => executeSideClose('SHORT'));

    </script>
</body>
