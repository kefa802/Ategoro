<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Summary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .f1-card { border-left: 5px solid #e10600; }
        .npb-card { border-left: 5px solid #003567; }
        .jleague-card { border-left: 5px solid #009933; }
    </style>
</head>
<body class="bg-gray-100">

    <header class="bg-slate-800 text-white p-4 sticky top-0 z-50 shadow-lg">
        <h1 class="text-xl font-bold text-center italic">SPORTS FEED</h1>
    </header>

    <main class="max-w-2xl mx-auto p-4">
        <div id="news-container" class="grid gap-4">
            <p id="loading-text" class="text-center py-10 text-gray-500">データを取得中...</p>
        </div>
    </main>

    <script>
        // Yahoo!ニュースのRSSフィード
        const FEEDS = [
            { label: 'F1', url: 'https://news.yahoo.co.jp/rss/categories/sports.xml', style: 'f1-card' },
            { label: 'プロ野球', url: 'https://news.yahoo.co.jp/rss/topics/top-picks.xml', style: 'npb-card' },
            { label: 'Jリーグ', url: 'https://news.yahoo.co.jp/rss/categories/sports.xml', style: 'jleague-card' }
        ];

        async function fetchNews() {
            const container = document.getElementById('news-container');
            const loading = document.getElementById('loading-text');

            for (const feed of FEEDS) {
                try {
                    // CORS回避用のプロキシ経由で取得
                    const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(feed.url)}`);
                    const data = await response.json();
                    
                    // 文字列として返ってくるXMLをパース
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(data.contents, "text/xml");
                    const items = xmlDoc.querySelectorAll("item");

                    if(loading) loading.remove();

                    items.forEach((item, index) => {
                        if(index > 3) return; // 各カテゴリ4件ずつ表示
                        
                        const title = item.querySelector("title").textContent;
                        const link = item.querySelector("link").textContent;
                        const pubDate = new Date(item.querySelector("pubDate").textContent);
                        const timeStr = pubDate.getHours() + ":" + ("0" + pubDate.getMinutes()).slice(-2);

                        const div = document.createElement('div');
                        div.className = `bg-white p-4 rounded shadow-sm ${feed.style} active:bg-gray-50 transition-colors`;
                        div.innerHTML = `
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400">${feed.label}</span>
                                <span class="text-[10px] text-gray-400">${timeStr}</span>
                            </div>
                            <a href="${link}" target="_blank" class="text-md font-bold leading-snug block hover:text-blue-600">${title}</a>
                        `;
                        container.appendChild(div);
                    });
                } catch (e) {
                    console.error("Error:", e);
                    if(loading) loading.innerText = "読み込みに失敗しました。再読み込みしてください。";
                }
            }
        }

        fetchNews();
    </script>
</body>
</html>
