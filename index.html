<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>当五郎 - 競艇予想</title>
    <style>
        :root { --blue: #01579b; --gold: #ffc107; --bg: #f0f2f5; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; }
        .header { background: var(--blue); color: white; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .container { padding: 10px; max-width: 600px; margin: auto; }
        .box { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .btn { background: var(--gold); border: none; padding: 15px; border-radius: 30px; font-weight: bold; width: 90%; cursor: pointer; font-size: 1.1rem; box-shadow: 0 4px 0 #d4a017; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #d4a017; }
        .card { background: white; border-radius: 10px; padding: 12px; margin-bottom: 15px; border-left: 6px solid var(--blue); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .title { font-size: 1.2rem; font-weight: bold; color: var(--blue); margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .race-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .race-box { background: #f8f9fa; border: 1px solid #eee; padding: 8px 4px; border-radius: 6px; text-align: center; }
        .pred { color: #d32f2f; font-weight: bold; font-size: 0.9rem; display: block; margin-top: 3px; }
        #status { text-align: center; margin: 15px; font-weight: bold; color: var(--blue); }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0;">当五郎</h1>
    <p style="margin:5px 0 0; font-size:0.7rem; opacity:0.8;">工藤専用・サーバー連携モード</p>
</div>

<div class="container">
    <div class="box">
        <input type="date" id="targetDate" style="padding:12px; width:80%; margin-bottom:15px; border-radius:8px; border:1px solid #ccc; font-size:1rem;">
        <button class="btn" onclick="fetchFromGas()">予想を開始する</button>
    </div>
    <div id="status"></div>
    <div id="output"></div>
</div>

<script>
    // 先ほど取得したURLをセット済みです
    const gasUrl = "https://script.google.com/macros/s/AKfycbzO6Tk_udWmVzUTEk17ga3b48YXJSCM94EWerMT3gFWszwS3u1ogVeul50v3YYCWNedFw/exec";

    window.onload = () => {
        document.getElementById('targetDate').value = new Date().toISOString().split('T')[0];
    };

    async function fetchFromGas() {
        const output = document.getElementById('output');
        const status = document.getElementById('status');
        const ymd = document.getElementById('targetDate').value.replace(/-/g, '');
        
        output.innerHTML = '';
        status.innerText = '🚀 工藤専用サーバーに接続中...';

        try {
            const res = await fetch(`${gasUrl}?ymd=${ymd}`);
            const data = await res.json();
            
            if (!data || data.length === 0) {
                status.innerText = '⚠️ 本日のデータはまだ準備されていないようです。';
                return;
            }
            
            status.innerText = `✅ ${data.length}会場の取得に成功しました`;
            data.forEach(st => {
                let grid = '';
                st.races.forEach(r => {
                    grid += `<div class="race-box"><small style="color:#666;">${r.raceNo}R</small><span class="pred">${calc(r.players)}</span></div>`;
                });
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div class="title">${st.stadiumName}</div><div class="race-grid">${grid}</div>`;
                output.appendChild(card);
            });
        } catch (e) {
            status.innerText = '❌ サーバー接続エラー。GASのデプロイ設定を確認してください。';
        }
    }

    function calc(players) {
        if (!players) return "---";
        let p = players.map(x => ({
            n: x.bracketNo, 
            s: (parseFloat(x.nationalWinRate)||0)*0.8 + (parseFloat(x.localWinRate)||0)*0.2
        })).sort((a,b) => b.s - a.s);
        
        // 1号艇がスコア1位なら1頭、そうでなければ上位ボックス風
        if (p[0].n === 1) {
            return `1-${p[1].n}${p[2].n}-${p[1].n}${p[2].n}${p[3].n}`;
        } else {
            return `${p[0].n}-${p[1].n}-${p[2].n}`;
        }
    }
</script>
</body>
</html>
