<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OANDA API テスト画面</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; max-width: 400px; }
        button { padding: 10px 15px; cursor: pointer; background-color: #0056b3; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #004494; }
        #result { margin-top: 15px; font-weight: bold; white-space: pre-line; }
        .error { color: red; }
    </style>
</head>
<body>

    <div class="card">
        <h2>OANDA 口座サマリー</h2>
        <button id="fetchBtn">残高を取得する</button>
        <div id="result">待機中...</div>
    </div>

    <script>
        // ⚠️ セキュリティ警告：
        // 実際の公開サーバー上にこのHTMLをアップロードすると、APIトークンが世界中に漏洩します。
        // あくまでローカル（自分のPC内）での検証用としてのみ使用してください。
        
        const apiToken = "ここに_取得した_APIアクセストークン_を貼り付けます";
        const accountId = "ここに_OANDAの_口座ID_を貼り付けます";
        
        // 本番環境（NYサーバープロコース）のURL
        const baseUrl = "https://api-fxtrade.oanda.com/v3";

        document.getElementById('fetchBtn').addEventListener('click', async () => {
            const resultDiv = document.getElementById('result');
            resultDiv.className = "";
            resultDiv.innerText = "通信中...";

            const url = `${baseUrl}/accounts/${accountId}/summary`;

            try {
                // fetch APIを使ってOANDAサーバーへリクエストを送信
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${apiToken}`,
                        'Accept-Datetime-Format': 'RFC3339',
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTPエラー: ${response.status}`);
                }

                // JSONデータを解析
                const data = await response.json();
                
                // 必要な数値を抽出
                const balance = data.account.balance;
                const unrealizedPL = data.account.unrealizedPL;
                const marginAvailable = data.account.marginAvailable;

                // 画面に表示
                resultDiv.innerText = `残高: ${balance} 円\n含み損益: ${unrealizedPL} 円\n取引可能額: ${marginAvailable} 円`;

            } catch (error) {
                console.error("エラー詳細:", error);
                resultDiv.className = "error";
                resultDiv.innerText = `データの取得に失敗しました。\n（※ブラウザのCORS制限によりブロックされている可能性があります。F12キーでコンソールを確認してください。）`;
            }
        });
    </script>

</body>
</html>
