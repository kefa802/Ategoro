<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>当五郎</title>
    <style>
        :root { --blue: #01579b; --gold: #ffc107; --bg: #f0f2f5; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 0; }
        .header { background: var(--blue); color: white; padding: 20px; text-align: center; position: relative; }
        .ver { position: absolute; top: 5px; right: 10px; font-size: 0.6rem; opacity: 0.7; }
        .box { background: white; padding: 20px; border-radius: 15px; margin: 15px; text-align: center; }
        .btn { background: var(--gold); border: none; padding: 15px; border-radius: 30px; font-weight: bold; width: 90%; cursor: pointer; }
        .card { background: white; border-radius: 12px; padding: 15px; margin: 15px; border-left: 6px solid var(--blue); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .race-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .race-box { background: #f8f9fa; padding: 8px; border-radius: 8px; text-align: center; border: 1px solid #eee; }
        .pred { color: #d32f2f; font-weight: bold; display: block; margin-top: 4px; }
    </style>
</head>
<body>
<div class="header"><span class="ver">Ver 1.0.2</span><h1>当五郎</h1></div>
<div class="container">
    <div class="box">
        <input type="date" id="targetDate" style="padding:10px; width:80%; margin-bottom:15px;">
        <button class="btn" onclick="load()">予想を開始する</button>
    </div>
    <div id="status" style="text-align:center; font-weight:bold;"></div>
    <div id="output"></div>
</div>

<script>
    window.onload = () => { document.getElementById('targetDate').value = new Date().toISOString().split('T')[0]; };

    function load() {
        const ymd = document.getElementById('targetDate').value.replace(/-/g, '');
        document.getElementById('status').innerText = '🚀 究極同期モードで解析中...';
        document.getElementById('output').innerHTML = '';

        // ブラウザのブロックを完全に回避するため、Google検索の仕組みを悪用したプロキシを使います
        const script = document.createElement('script');
        // 「yql」的な役割を果たす超軽量プロキシ
        script.src = `https://api.allorigins.win/get?url=${encodeURIComponent('https://boatraceopenapi.github.io/programs/' + ymd + '/all.json')}&callback=process`;
        document.body.appendChild(script);
    }

    // データが届いた時に動く関数
    window.process = function(json) {
        const status = document.getElementById('status');
        const output = document.getElementById('output');
        try {
            const data = JSON.parse(json.contents);
            status.innerText = `✅ ${data.length}会場を取得`;
            data.forEach(st => {
                let grid = '';
                st.races.forEach(r => { grid += `<div class="race-box"><small>${r.raceNo}R</small><span class="pred">${predict(r.players)}</span></div>`; });
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div style="font-weight:bold;color:var(--blue);">${st.stadiumName}</div><div class="race-grid">${grid}</div>`;
                output.appendChild(card);
            });
        } catch(e) {
            status.innerText = '❌ データ形式エラー。もう一度押してください。';
        }
    }

    function predict(players) {
        if (!players) return "---";
        let p = players.map(x => ({n: x.bracketNo, s: (parseFloat(x.nationalWinRate)||0)*0.8 + (parseFloat(x.localWinRate)||0)*0.2})).sort((a,b) => b.s - a.s);
        return p[0].n === 1 ? `1-${p[1].n}${p[2].n}-全` : `${p[0].n}-${p[1].n}-${p[2].n}`;
    }
</script>
</body>
</html>
