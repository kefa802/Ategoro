<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Summary - 工藤カスタム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .f1-card { border-left: 4px solid #e10600; }
        .npb-card { border-left: 4px solid #003567; }
        .jleague-card { border-left: 4px solid #009933; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">

    <header class="bg-slate-800 text-white p-4 sticky top-0 z-50 shadow-md">
        <h1 class="text-xl font-bold text-center">Sports News Feed</h1>
    </header>

    <main class="max-w-4xl mx-auto p-4">
        <div id="news-container" class="space-y-4">
            <p class="text-center py-10">読み込み中...</p>
        </div>
    </main>

    <script>
        // Yahooスポーツの各種RSSフィードURL
        const FEEDS = [
            { label: 'F1', url: 'https://news.yahoo.co.jp/rss/categories/sports.xml', category: 'f1-card' }, // ※本来はF1専用RSSを指定
            { label: 'プロ野球', url: 'https://news.yahoo.co.jp/rss/topics/top-picks.xml', category: 'npb-card' },
            { label: 'Jリーグ', url: 'https://news.yahoo.co.jp/rss/categories/sports.xml', category: 'jleague-card' }
        ];

        async function fetchNews() {
            const container = document.getElementById('news-container');
            container.innerHTML = ''; // クリア

            for (const feed of FEEDS) {
                try {
                    // RSSをJSONに変換して取得するツール（API）を利用
                    const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`);
                    const data = await response.json();

                    if (data.status === 'ok') {
                        data.items.slice(0, 5).forEach(item => {
                            const card = document.createElement('div');
                            card.className = `bg-white p-4 rounded-lg shadow ${feed.category} hover:shadow-md transition-shadow cursor-pointer`;
                            card.onclick = () => window.open(item.link, '_blank');
                            
                            card.innerHTML = `
                                <div class="flex justify-between items-start mb-2">
                                    <span class="text-xs font-bold px-2 py-1 bg-gray-200 rounded text-gray-700">${feed.label}</span>
                                    <span class="text-xs text-gray-500">${new Date(item.pubDate).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                                </div>
                                <h3 class="font-bold text-lg leading-snug">${item.title}</h3>
                                <p class="text-sm text-gray-600 mt-2 line-clamp-2">${item.description || ''}</p>
                            `;
                            container.appendChild(card);
                        });
                    }
                } catch (error) {
                    console.error('読み込み失敗:', error);
                }
            }
        }

        // 実行
        fetchNews();
    </script>
</body>
</html>
